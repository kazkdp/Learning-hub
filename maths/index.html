<!DOCTYPE html>
<html lang="en-GB" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
  <title>Maths – Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../kit/kit.css?v=6">
  <style>
    .how {
      display: flex; flex-wrap: wrap; gap: 10px; list-style: none;
      padding: 0; margin: 0 0 24px;
    }
    .how li {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 2px solid var(--line); border-radius: 14px;
      padding: 10px 16px; font-size: 1.05rem;
    }
    .how .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--green); color: #fff; font-weight: 700;
    }
    .tile-level { color: var(--muted); font-size: 1rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn-home" href="../index.html">🏠 Home</a>
    <h1 class="topbar-title">🔢 Maths</h1>
  </header>

  <main class="page">
    <h2 class="page-title">Pick a maths game</h2>
    <ol class="how" aria-label="How the maths games work">
      <li><span class="num">1</span> Pick a game</li>
      <li><span class="num">2</span> Play a few short rounds</li>
      <li><span class="num">3</span> Get a star for each part right first time</li>
    </ol>

    <div class="tiles" id="games" aria-live="polite">
      <p class="message-box">Loading…</p>
    </div>

    <p class="note">The games start easy and get a little harder as you get better.</p>
  </main>

  <script src="../kit/kit.js?v=6"></script>
  <script>
    (function () {
      var SECTION = 'Maths';
      var box = document.getElementById('games');
      var acts = Kit.starSummary().acts;

      function badgeFor(page) {
        var a = acts[page];
        var progress = Kit.setting('progress:' + page);
        if (!a && !progress) return '<span class="tile-badge is-new">New</span>';
        return (progress && progress.level ? '<span class="tile-level">Level ' + Kit.esc(progress.level) + '</span>' : '') +
          '<span class="tile-badge">⭐ ' + (a ? a.stars : 0) + (a && a.stars === 1 ? ' star' : ' stars') + '</span>';
      }

      Kit.loadList().then(function (list) {
        var items = list.items.filter(function (it) { return it.section === SECTION; });
        box.innerHTML = items.map(function (it) {
          return '<a class="tile" href="' + Kit.esc(Kit.url(it.page)) + '">' +
            Kit.picture(it.picture, '🔢') +
            '<span class="tile-title">' + Kit.esc(it.title) + '</span>' +
            badgeFor(it.page) +
            '</a>';
        }).join('') || '<p class="message-box">No maths games yet.</p>';
      }).catch(function () {
        box.innerHTML = '<p class="message-box">Sorry, the maths games did not load. Try refreshing the page.</p>';
      });
    })();
  </script>
</body>
</html>

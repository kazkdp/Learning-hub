<!DOCTYPE html>
<html lang="en-GB" data-root="..">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patterns – Learning Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css?v=5">
<style>
  /* ============================================================
     Patterns. Every puzzle is a train: the question is always at
     the top, the train in the middle and the answers underneath.
     After every answer the train splits into the bit that repeats.
     Shared look (font, top bar, Home button) comes from kit.css;
     the colours match Tallies and Bar Charts.
     ============================================================ */
  :root {
    --paper: #FFFFFF;
    --edge: #BCD1E7;
    --ink: #1D2B4F;
    --ink-soft: #55657F;
    --ink-faint: #8C9AB2;
    --good: #1E9E5A; --good-dark: #157443; --good-tint: #E4F6EB;
    --fix: #E89A00;  --fix-dark: #A86F00;  --fix-tint: #FFF3D6;
    --sun: #FFC83D;  --sun-dark: #D69A00;  --sun-tint: #FFF6D8;
    --unit: #1F6FD1; --unit-tint: #E2EDFB;
    --focus: #2F6FEB;
  }

  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- Top bar: Home, Maths, level, puzzles in this sitting, tools ---------- */
  .topbar { flex: none; gap: 10px 14px; }
  .game-id { margin-right: auto; min-width: 0; }
  .game-id .topbar-title { margin: 0; white-space: nowrap; }
  .level-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .level-badge {
    padding: 2px 10px; border-radius: 999px;
    font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
    background: var(--ink);
  }
  .level-badge.pop { animation: badgepop .9s ease-out; }
  @keyframes badgepop { 35% { transform: scale(1.25); background: var(--good); } }
  .meter { display: inline-flex; align-items: center; gap: 6px; }
  .meter-bar { width: 64px; height: 10px; border-radius: 5px; background: #E6ECF3; overflow: hidden; }
  .meter-fill { display: block; height: 100%; border-radius: 5px; background: var(--sun); transition: width .4s ease; }
  .meter-num { font-size: 14px; font-weight: 700; color: var(--fix-dark); white-space: nowrap; }
  .meter.pop .meter-fill { animation: meterpop .7s ease-out; }
  @keyframes meterpop { 40% { background: var(--sun-dark); } }
  .meter .top { font-size: 14px; font-weight: 700; color: var(--fix-dark); white-space: nowrap; }
  .round-label { font-size: 15px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
  .flavour { padding: 2px 9px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .flavour.challenge { background: #FFE6D2; color: #8F3A00; }
  .flavour.new { background: #E7E2FA; color: #4A2E98; }
  .flavour.practice { background: var(--sun-tint); color: #6B4A00; }
  .flavour.review { background: #E2F3F4; color: #076870; }
  .flavour.watch { background: var(--unit-tint); color: #144A8F; }

  .dots { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 6px; }
  .dots li {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    background: var(--paper); border: 2px solid var(--edge); color: var(--ink-faint);
  }
  .dots li.now { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dots li.done { background: var(--good-tint); border-color: var(--good); color: var(--good-dark); }
  .dots li.star { background: #FFF6D6; border-color: #E8A400; font-size: 14px; }

  .tools { flex: none; display: flex; gap: 8px; }
  .tools .btn-tool { min-width: 46px; padding: 8px 12px; }
  .tools .ico { font-size: 20px; line-height: 1; }
  .tool-text { display: none; }
  @media (min-width: 1500px) { .tool-text { display: inline; } }

  /* ---------- Game area ---------- */
  .app {
    flex: 1; min-height: 0;
    width: 100%; max-width: 1500px;
    margin: 0 auto;
    padding: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stage { flex: 1; min-height: 0; display: flex; }
  .panel {
    /* --cap: the biggest a carriage may be; --chs: the size of an answer button.
       Both shrink on shorter screens so the whole puzzle stays in view. */
    --cap: clamp(46px, 15dvh, 108px);
    --chs: clamp(58px, 13.5dvh, 102px);
    flex: 1; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    padding: 10px 16px;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 18px;
    box-shadow: 0 4px 0 var(--edge);
    overflow: auto;
  }
  .panel.lay-two { --cap: clamp(38px, 10dvh, 84px); --chs: clamp(54px, 11.5dvh, 92px); }
  .panel.lay-opts { --cap: clamp(36px, 9dvh, 72px); }
  .panel.lay-tall { --cap: clamp(44px, 13.5dvh, 100px); --chs: clamp(52px, 11.5dvh, 90px); }
  .q-row { flex: none; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; min-height: 42px; }
  .q { font-size: clamp(21px, 3.9dvh, 30px); color: var(--ink); }
  .rule-card {
    padding: 3px 14px; border-radius: 12px;
    font-size: clamp(17px, 3.1dvh, 23px); font-weight: 700;
    background: var(--unit-tint); border: 2px solid #B9D2F3; color: #144A8F;
  }
  .scene { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .answers {
    flex: none;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 14px;
    min-height: calc(var(--chs) + 10px); padding: 2px 0 4px;
  }
  .panel.lay-opts .answers { min-height: 0; padding: 0; }
  .answers.done { visibility: hidden; }
  .locked { pointer-events: none; }
  .row-label { margin: 0 0 -26px 6px; position: relative; z-index: 3; font-size: 15px; font-weight: 700; color: var(--ink-soft); }

  /* ---------- The train ---------- */
  .train-wrap {
    --pt: 40px; --pb: 46px;
    container-type: inline-size;
    position: relative; overflow: hidden;
    padding: var(--pt) 6px var(--pb);
  }
  .panel.lay-two .train-wrap, .panel.lay-opts .train-wrap { --pt: 32px; --pb: 38px; }
  .train {
    /* A carriage is as big as fits: --n carriages, the engine, and room for the gaps (--us) when the train splits into its bits */
    --car: max(22px, min(var(--cap, 104px), calc((100cqw - 16px - var(--us, 0) * 14px) / (var(--n) * 1.16 + var(--eng, 1.5) + var(--us, 0) * .16))));
    --gap: calc(var(--car) * .16);
    display: flex; align-items: flex-end; gap: var(--gap);
    width: max-content; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .train.roll { animation: roll-in .9s cubic-bezier(.18, .8, .25, 1); }
  .train.leave { animation: roll-out .4s ease-in forwards; }
  @keyframes roll-in { from { transform: translateX(min(80vw, 1000px)); } to { transform: none; } }
  @keyframes roll-out { to { transform: translateX(-120vw); } }
  .track { position: absolute; left: 0; right: 0; bottom: calc(var(--pb) - 13px); height: 5px; border-radius: 3px; background: #9AABBF; }
  .track::after {
    content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 5px;
    background: repeating-linear-gradient(90deg, #C9D4E0 0 9px, transparent 9px 24px);
  }
  .engine { flex: none; width: calc(var(--car) * 1.32); height: calc(var(--car) + 8px); margin-bottom: -8px; }
  .engine svg { display: block; width: 100%; height: 100%; }
  .car {
    flex: none; position: relative;
    display: grid; place-items: center;
    width: var(--car); height: var(--car);
    background: #fff; border: 3px solid var(--edge); border-radius: calc(var(--car) * .16);
    box-shadow: 0 3px 0 var(--edge);
    transition: margin-left .4s ease, background-color .3s, border-color .3s, transform .2s;
  }
  .train.tall .car { height: calc(var(--car) * 1.5); }
  .car::before {
    content: ""; position: absolute; right: 100%; bottom: 18%;
    width: calc(var(--gap) + 3px); height: max(3px, calc(var(--car) * .05)); border-radius: 2px;
    background: #6B7C93; transition: opacity .3s;
  }
  .wheel {
    position: absolute; bottom: -8px;
    width: clamp(8px, calc(var(--car) * .17), 18px); aspect-ratio: 1; border-radius: 50%;
    background: #33435C; border: 2px solid #fff; box-shadow: 0 0 0 2px #33435C;
  }
  .wheel.l { left: 14%; } .wheel.r { right: 14%; }
  .car.empty { border-style: dashed; background: #F6F9FC; box-shadow: none; }
  .car.q, .car.now { border-style: dashed; border-color: var(--sun-dark); background: var(--sun-tint); box-shadow: 0 3px 0 #F0D27A; }
  .qmark { font-size: calc(var(--car) * .5); font-weight: 700; line-height: 1; color: var(--sun-dark); }
  .car.filled { border-color: var(--good); background: var(--good-tint); box-shadow: 0 3px 0 var(--good-dark); }
  .car.just .tok { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .car.outline { border-color: var(--unit); border-style: solid; box-shadow: 0 3px 0 var(--unit); background: #F3F8FF; }
  .car.lit { border-color: var(--unit); background: var(--unit-tint); box-shadow: 0 3px 0 var(--unit); transform: translateY(-4px); }
  .car.nope { background: #ECEFF3; border-color: #A9B5C6; }
  .train.tap .car { cursor: pointer; }
  .train.tap .car:hover { border-color: var(--focus); transform: translateY(-3px); }
  .ghost { width: 100%; height: 100%; display: grid; place-items: center; opacity: .25; }
  .gapdots { flex: none; width: var(--car); align-self: center; text-align: center; font-size: calc(var(--car) * .34); font-weight: 700; color: var(--ink-faint); white-space: nowrap; }
  .gapdots + .car::before { display: none; }
  /* Splitting the train into the bits that repeat */
  .train.split .car.ustart { margin-left: calc(var(--gap) + 14px); }
  .train.split .car.ustart::before { opacity: 0; }
  .ubar {
    position: absolute; left: -3px; right: calc(-1 * var(--gap) - 3px); bottom: calc(-1 * var(--pb) + 6px);
    height: 7px; border-radius: 4px; background: var(--unit);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .car.uend .ubar, .car:last-child .ubar { right: -3px; }
  .train.split .car.grouped .ubar { opacity: .25; }
  .car.lit .ubar, .train.units-done .car.grouped .ubar { opacity: .9; }
  /* Labels above carriages: letters (A B B), block counts, carriage numbers */
  .lbl {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    padding: 0 7px; border-radius: 8px;
    font-size: 15px; font-weight: 700; white-space: nowrap;
    color: #4A2E98; background: #EFEBFC;
    opacity: 0; transition: opacity .3s;
  }
  .train.show-lbl .lbl { opacity: 1; }
  /* The jumps between numbers */
  .hop {
    position: absolute; top: -32px; left: calc(-.5 * var(--gap) - 1.5px); transform: translateX(-50%); z-index: 2;
    padding: 0 7px; border-radius: 999px;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    color: var(--fix-dark); background: var(--fix-tint); border: 2px solid var(--fix);
    opacity: 0; transition: opacity .3s;
  }
  .train.show-hops .hop.on { opacity: 1; }

  /* ---------- Pattern pieces ---------- */
  .tok { width: 80%; height: 80%; display: grid; place-items: center; pointer-events: none; }
  .tok svg { display: block; width: 100%; height: 100%; }
  .tok.grid, .choice .tok.grid { width: 92%; height: 92%; }
  .emo { font-size: calc(var(--car) * .56); line-height: 1; font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
  .num { font-size: calc(var(--car) * .42); font-weight: 700; color: var(--ink); white-space: nowrap; letter-spacing: -.5px; }
  .num.long { font-size: calc(var(--car) * .31); }
  .num.xlong { font-size: calc(var(--car) * .25); }
  .tok.tower { width: 90%; height: 90%; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; gap: 2px; }
  .tok.tower i {
    display: block; flex: none; width: 60%; height: min(19%, calc((100% - 20px) / var(--tn, 5)));
    background: #F07C1A; border: 2px solid #B3550A; border-radius: 3px;
  }

  /* ---------- Answer buttons ---------- */
  .choice {
    --car: var(--chs);
    width: var(--chs); height: var(--chs); padding: 6px;
    display: grid; place-items: center;
    background: #fff; border: 3px solid var(--edge); border-radius: 20px;
    box-shadow: 0 4px 0 var(--edge);
    transition: transform .15s, opacity .3s, border-color .2s;
  }
  .choice:hover:not(:disabled) { border-color: var(--focus); transform: translateY(-2px); }
  .choice .tok { width: 84%; height: 84%; }
  .choice.gone { opacity: .25; filter: grayscale(1); }
  .choice.used { opacity: 0; pointer-events: none; }
  .choice.right { border-color: var(--good); background: var(--good-tint); box-shadow: 0 4px 0 var(--good-dark); opacity: 1; filter: none; }
  .choice.txt { width: auto; min-width: 170px; padding: 0 20px; font-size: clamp(18px, 3dvh, 23px); font-weight: 700; color: var(--ink); }
  .choice.grp { width: auto; min-width: var(--chs); padding: 6px 12px; display: flex; align-items: center; gap: 4px; }
  .grp-tok { --car: calc(var(--chs) * .62); width: calc(var(--chs) * .52); height: calc(var(--chs) * .52); display: grid; place-items: center; }
  .grp-tok .tok { width: 100%; height: 100%; }
  .choice.nudge { animation: nudge .45s; }
  @keyframes nudge { 30% { transform: translateY(-6px); } 60% { transform: translateY(2px); } }
  .answers.towers .choice { height: calc(var(--chs) * 1.55); }
  .mini-btn {
    min-height: 48px; padding: 0 14px;
    font-size: 17px; font-weight: 700; color: var(--ink-soft);
    background: var(--paper); border: 2px solid var(--edge); border-radius: 14px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .mini-btn:disabled { opacity: .4; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-top: 6px; }
  .opt {
    display: block; width: 100%; min-width: 0; padding: 0 4px; text-align: left;
    background: #fff; border: 3px solid var(--edge); border-radius: 18px;
    box-shadow: 0 4px 0 var(--edge);
    transition: opacity .3s, border-color .2s;
  }
  .opt:hover:not(:disabled) { border-color: var(--focus); }
  .opt.gone { opacity: .3; filter: grayscale(1); }
  .opt.right { border-color: var(--good); background: var(--good-tint); opacity: 1; filter: none; }
  .opt .train-wrap { --pt: 28px; --pb: 30px; }
  .opt .train { --cap: clamp(30px, 7.2dvh, 56px); }

  /* ---------- The card at the end of a stage ---------- */
  .fact-card { margin: auto; max-width: 620px; padding: 10px; text-align: center; }
  .fact-emoji { font-size: 54px; line-height: 1; }
  .fact-card h2 { margin: 6px 0 12px; font-size: 26px; color: var(--ink); }
  .fact-label { font-size: 15px; font-weight: 700; color: var(--gold-ink); }
  .fact-text {
    margin: 4px 0 14px; padding: 14px 18px;
    font-size: 22px; font-weight: 700; color: var(--ink);
    background: var(--gold-soft); border: 2px solid #F3D57C; border-radius: 16px;
  }
  .fact-next { font-size: 18px; color: var(--ink-soft); }

  /* ---------- Buttons ---------- */
  .btn {
    --sh: rgba(0, 0, 0, .2);
    min-height: 48px; padding: 0 16px;
    font-size: 19px; line-height: 1;
    border: 0;
    box-shadow: 0 4px 0 var(--sh);
    transition: transform .07s ease, box-shadow .07s ease;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sh); }
  .btn:disabled { opacity: .4; }
  .btn-sun { background: var(--sun); color: var(--ink); --sh: var(--sun-dark); min-height: 56px; }
  .actions .btn-primary { min-width: 190px; }
  .actions .btn-primary:disabled { opacity: .45; filter: none; }

  /* ---------- Message and main buttons ---------- */
  .actionbar {
    flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 8px;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 16px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .msg {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    min-height: 56px; padding: 6px 12px 6px 6px;
    border-radius: 12px;
    transition: background-color .2s;
  }
  .msg[data-kind="ok"] { background: var(--good-tint); }
  .msg[data-kind="fix"] { background: var(--fix-tint); }
  .msg[data-kind="hint"] { background: var(--sun-tint); }
  .msg p { margin: 0; font-size: 19px; font-weight: 600; }
  .say-btn {
    flex: none; width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; font-size: 19px;
    background: var(--paper); border: 2px solid var(--edge); border-radius: 50%;
  }
  .actions { flex: none; display: flex; gap: 10px; }

  /* ---------- End of a sitting ---------- */
  .summary { flex: 1; min-height: 0; display: grid; place-items: center; overflow: auto; }
  .summary-card {
    width: min(600px, 100%);
    padding: 24px;
    text-align: center;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 22px;
    box-shadow: 0 5px 0 var(--edge);
  }
  .trophy { font-size: 58px; line-height: 1; }
  .summary h2 { margin: 6px 0 8px; font-size: 30px; color: var(--ink); }
  .summary-stars { margin: 0 0 12px; font-size: 20px; color: var(--ink-soft); }
  .summary-stars b { font-size: 40px; color: #B26B00; margin-right: 6px; }
  .summary .dots { justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .summary-level { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .summary-level .level-badge { font-size: 19px; padding: 4px 14px; }
  .summary p.note-line { margin: 0 0 12px; font-size: 18px; color: var(--ink-soft); }
  .summary p.fact-line {
    margin: 0 0 16px; padding: 10px 14px;
    font-size: 17px; text-align: left; color: var(--ink);
    background: var(--gold-soft); border: 2px solid #F3D57C; border-radius: 14px;
  }
  .fact-line b { display: block; font-size: 14px; color: var(--gold-ink); }
  .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- Grown-ups panel ---------- */
  dialog.grown {
    width: min(700px, calc(100vw - 24px));
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
    padding: 0;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 20px;
    box-shadow: 0 6px 0 var(--edge), 0 24px 60px rgba(29, 43, 79, .28);
  }
  dialog.grown::backdrop { background: rgba(29, 43, 79, .35); }
  .grown-head {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px 12px;
    background: var(--paper); border-bottom: 2px solid #E6EEF7;
  }
  .grown-head h2 { font-size: 22px; color: var(--ink); }
  .grown-body { padding: 6px 20px 20px; }
  .g-sec { padding: 14px 0; border-bottom: 2px solid #EEF3F9; }
  .g-sec:last-child { border-bottom: 0; }
  .g-sec h3 { margin: 0 0 10px; font-size: 18px; }
  .g-level { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .g-num { font-size: 30px; font-weight: 700; }
  .g-of { font-size: 18px; font-weight: 700; color: var(--ink-soft); }
  .g-desc { margin: 4px 0; font-size: 17px; color: var(--ink-soft); }
  .g-note { margin: 8px 0 0; padding: 8px 12px; font-size: 16px; background: var(--fix-tint); border-radius: 12px; }
  .g-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .g-btns .btn-secondary:disabled { opacity: .45; cursor: default; }
  .g-jump { min-height: 48px; max-width: 100%; padding: 0 10px; font-size: 16px; font-weight: 700; background: #fff; border: 2px solid #c7e6d2; border-radius: 14px; }
  .g-check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; font-size: 16px; cursor: pointer; }
  .g-check input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--green); }
  .g-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .g-pill { padding: 6px 13px; font-size: 15px; font-weight: 700; color: var(--ink-soft); background: #fff; border: 2px solid var(--edge); border-radius: 999px; }
  .g-pill[aria-pressed="true"] { color: var(--green-dark); background: var(--green-soft); border-color: #9fd2b3; }
  .stat-row { display: grid; grid-template-columns: minmax(170px, 1.5fr) 2fr 92px; align-items: center; gap: 12px; margin: 8px 0; }

  .g-how li { margin: 5px 0; }
  .g-details summary { cursor: pointer; font-size: 17px; font-weight: 700; }

  .g-stage small { font-weight: 600; color: var(--ink-soft); }
  .g-levels { margin: 0; padding-left: 0; list-style: none; font-size: 15px; color: var(--ink-soft); }
  .g-levels li { padding: 3px 8px; border-radius: 8px; }
  .g-levels li.here { background: var(--green-soft); color: var(--green-dark); font-weight: 700; }
  .text-btn {
    padding: 6px 4px;
    font-size: 16px; font-weight: 700; color: var(--ink-soft);
    background: none; border: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---------- Calm mode and smaller screens ---------- */
  body.calm .train, body.calm .car, body.calm .tok, body.calm .choice, body.calm .level-badge, body.calm .meter-fill {
    animation: none !important; transition: none !important;

  body.calm .car.lit { transform: none; }
  @media (max-width: 1180px) {
    .round-label { display: none; }

  @media (max-width: 900px), (max-height: 520px) {
    body { height: auto; min-height: 100vh; }
    .app { flex: none; }

    .panel { overflow: visible; --cap: 96px; --chs: 88px; }
    .panel.lay-two { --cap: 78px; --chs: 80px; }
    .panel.lay-opts { --cap: 66px; }

    .opt .train { --cap: 52px; }
    .scene { min-height: 190px; }

  }
  @media (max-width: 620px) {
    body { font-size: 17px; }
    .app { padding: 8px; gap: 8px; }
    .game-id .topbar-title { font-size: 1.1rem; }
    .dots li { width: 24px; height: 24px; font-size: 12px; }
    .panel { padding: 8px; --chs: 76px; }
    .panel.lay-two, .panel.lay-tall { --chs: 68px; }
    /* phones: no engine, so the carriages get the room */
    .train-wrap { --eng: .25; padding-left: 2px; padding-right: 2px; }
    .engine { display: none; }
    .engine + .car::before { display: none; }
    .row-label { margin-bottom: -6px; font-size: 13px; }   /* no engine to sit above, so keep clear of the A B labels */
    .actionbar { flex-wrap: wrap; }

    .stat-row .track-bar { grid-column: 1 / -1; grid-row: 2; }
  }
</style>

<script src="../kit/kit.js?v=5"></script>
<script>
(() => {
  'use strict';

  /* ============================================================
     How this game fits into the Learning Hub
       - Every puzzle he gets right first time earns a star, like
         one star per question in Story Time.
       - Each sitting (10 puzzles) is saved to the hub after every
         puzzle, so the stars appear in My Stars straight away.
         Every puzzle counts, because every puzzle is new.
       - His level is saved with his stars (setting "progress:<page>"),
         so a My Stars backup carries it to another device.
     ============================================================ */
  const ACTIVITY = 'maths/patterns.html';
  const TITLE = 'Patterns';
  const SECTION = 'Maths';
  const PROGRESS_KEY = 'progress:' + ACTIVITY;
  const SITTING = 10;

  /* ============================================================
     Small helpers
     ============================================================ */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const esc = Kit.esc;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = n => Math.floor(Math.random() * n);
  const pick = arr => arr[rand(arr.length)];
  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const weightedPick = (items, weights) => {
    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  };
  const uniq = arr => [...new Set(arr)];
  const sum = arr => arr.reduce((a, b) => a + b, 0);
  const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);
  const r2 = v => Math.round(v * 100) / 100;
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const listNames = list => list.length <= 1 ? (list[0] || '') : list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
  const countUp = (obj, key, ok) => { const s = obj[key] || [0, 0]; s[0]++; if (ok) s[1]++; obj[key] = s; };

  /* ============================================================
     Settings. Sounds, read aloud and helper numbers are shared
     with the rest of the hub; the others belong to this game.
     ============================================================ */
  const THEMES = {
    colours: '🎨 Colours', shapes: '🔷 Shapes', animals: '🐶 Animals', weather: '🌦️ Weather', flags: '🚩 Flags',
    space: '🚀 Space', fruit: '🍎 Fruit', transport: '🚌 Transport', sport: '⚽ Sport', sea: '🐟 Sea animals',
  };
  let soundOn = Kit.soundsOn();
  let helpers = Kit.setting('mathsHelpers') !== false;
  const savedSet = Kit.setting('patterns');
  const SET = Object.assign({ watch: true, calm: false, themes: {} }, savedSet && typeof savedSet === 'object' ? savedSet : {});
  if (!SET.themes || typeof SET.themes !== 'object') SET.themes = {};
  const saveSet = () => Kit.setting('patterns', SET);
  const autoRead = () => Kit.setting('readAloud') === true;
  const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const motion = () => !SET.calm && !reduceMotion.matches;
  // Some computers can't draw flag pictures (they show two letters instead). If so, the flags are left out.
  const FLAGS_OK = (() => {
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '32px sans-serif';
      return ctx.measureText('🇬🇧').width < ctx.measureText('🇬').width * 1.6;
    } catch (e) { return true; }
  })();
  const themeOn = t => SET.themes[t] !== false && (t !== 'flags' || FLAGS_OK);

  /* ============================================================
     Soft sounds made in the browser (they follow the hub's Sounds setting)
     ============================================================ */
  let audioCtx = null;
  function tone(freq, t, dur, vol) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
  function playSound(type, step = 0) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      switch (type) {
        case 'tick':    tone(660, now, 0.12, 0.1); break;
        case 'undo':    tone(300, now, 0.1, 0.07); break;
        case 'soft':    tone(330, now, 0.18, 0.06); break;
        case 'unit':    tone(SCALE[step % SCALE.length], now, 0.28, 0.08); break;
        case 'right':   [523.25, 659.25, 783.99].forEach((f, i) => tone(f, now + i * 0.08, 0.35, 0.14)); break;
        case 'levelup': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tone(f, now + i * 0.09, 0.4, 0.14)); break;
      }
    } catch (e) { /* no audio available */ }
  }

  // Read aloud with the hub's voice (pictures are skipped, maths signs are said as words)
  function speak(text) {
    if (!text) return;
    Kit.speak(String(text)
      .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu, '')
      .replace(/(\d)½/g, '$1 and a half').replace(/½/g, 'a half')
      .replace(/−\s?(?=[\d½])/g, 'minus ').replace(/\+\s?(?=[\d½])/g, 'add ')
      .replace(/×\s?(?=\d)/g, 'times ').replace(/÷\s?(?=\d)/g, 'divide by ')
      .replace(/[–—…]/g, ',')
      .replace(/\s+/g, ' ').trim());
  }

  /* ============================================================
     Pattern pieces. Every piece has a key (to compare) and a name
     (said out loud and used in "the bit that repeats is ...").
     ============================================================ */
  const COLOURS = {
    red:    { c: '#D7352B', d: '#9E2219' },
    blue:   { c: '#1F6FD1', d: '#144A8F' },
    yellow: { c: '#F7C51E', d: '#B58A00' },
    green:  { c: '#1E9E5A', d: '#157443' },
    purple: { c: '#7B4FC9', d: '#55309A' },
    orange: { c: '#F07C1A', d: '#B3550A' },
    black:  { c: '#2E3440', d: '#111418' },
  };
  // Colours that can look alike (especially to colour-blind eyes) never go in the same puzzle
  const CLASH = new Set(['red|green', 'blue|purple', 'red|orange', 'orange|yellow', 'green|orange']);
  const clash = (a, b) => CLASH.has(a + '|' + b) || CLASH.has(b + '|' + a);
  const SHAPES = {
    circle: '<circle cx="50" cy="50" r="36"/>',
    square: '<rect x="15" y="15" width="70" height="70" rx="8"/>',
    triangle: '<path d="M50 11 L90 85 L10 85 Z" stroke-linejoin="round"/>',
    star: '<path d="M50 7 L61.8 37.6 L94 38.2 L68.5 58.4 L77.6 90 L50 71.4 L22.4 90 L31.5 58.4 L6 38.2 L38.2 37.6 Z" stroke-linejoin="round"/>',
    heart: '<path d="M50 88 C22 66 8 50 14 33 C20 16 42 14 50 31 C58 14 80 16 86 33 C92 50 78 66 50 88 Z"/>',
    diamond: '<path d="M50 6 L90 50 L50 94 L10 50 Z" stroke-linejoin="round"/>',
  };
  const EMOJI = {
    animals:   [['🐶', 'dog'], ['🐱', 'cat'], ['🐰', 'rabbit'], ['🐸', 'frog'], ['🐵', 'monkey'], ['🐧', 'penguin']],
    weather:   [['☀️', 'sun'], ['🌧️', 'rain'], ['❄️', 'snow'], ['☁️', 'cloud'], ['🌈', 'rainbow'], ['⚡', 'lightning']],
    flags:     [['🇬🇧', 'UK'], ['🇫🇷', 'France'], ['🇯🇵', 'Japan'], ['🇧🇷', 'Brazil'], ['🇨🇦', 'Canada'], ['🇩🇪', 'Germany']],
    space:     [['🚀', 'rocket'], ['🌙', 'moon'], ['⭐', 'star'], ['🪐', 'planet'], ['🌍', 'Earth'], ['☄️', 'comet']],
    fruit:     [['🍎', 'apple'], ['🍌', 'banana'], ['🍇', 'grapes'], ['🍊', 'orange'], ['🍓', 'strawberry'], ['🍐', 'pear']],
    transport: [['🚗', 'car'], ['🚌', 'bus'], ['🚲', 'bike'], ['✈️', 'plane'], ['🚂', 'train'], ['🚁', 'helicopter']],
    sport:     [['⚽', 'football'], ['🏀', 'basketball'], ['🎾', 'tennis ball'], ['🏉', 'rugby ball'], ['🏓', 'table tennis bat'], ['🏏', 'cricket bat']],
    sea:       [['🐟', 'fish'], ['🐙', 'octopus'], ['🦀', 'crab'], ['🐬', 'dolphin'], ['🐢', 'turtle'], ['🦈', 'shark']],
  };
  const SIZE_ITEMS = [['🍎', 'apple'], ['⭐', 'star'], ['🎈', 'balloon'], ['🐢', 'turtle'], ['🌳', 'tree'], ['⚽', 'football']];
  const SZ_NAME = { S: 'small', M: 'medium', B: 'big' };
  const SZ_SCALE = { S: 0.26, M: 0.43, B: 0.66 };
  const ARROW_NAME = { 0: 'up', 90: 'right', 180: 'down', 270: 'left' };
  const PIE_NAME = { 0: 'top right', 90: 'bottom right', 180: 'bottom left', 270: 'top left' };
  const TURN_ART = {
    arrow: '<path d="M50 8 L86 46 L63 46 L63 90 L37 90 L37 46 L14 46 Z" fill="#2B4C9B" stroke="#1A2F66" stroke-width="4" stroke-linejoin="round"/>',
    pie: '<circle cx="50" cy="50" r="40" fill="#fff" stroke="#1A2F66" stroke-width="4"/><path d="M50 50 L50 10 A40 40 0 0 1 90 50 Z" fill="#D7352B" stroke="#1A2F66" stroke-width="4" stroke-linejoin="round"/>',
  };

  function numText(v, fmt) {
    const neg = v < 0 ? '−' : '', a = Math.abs(v);
    if (fmt === 'half') { const w = Math.floor(a + 1e-9), half = a - w > 0.25; return neg + (half ? (w ? w : '') + '½' : String(w)); }
    if (fmt === 'dec') return neg + a.toFixed(1);
    return neg + String(r2(a));
  }

  // Growing shapes drawn on squared paper: [column, row from the bottom] for each block
  function gridCells(form, n) {
    const cells = [];
    if (form === 'L') { for (let r = 0; r < n; r++) cells.push([0, r]); for (let c = 1; c < n; c++) cells.push([c, 0]); }
    if (form === 'stairs') { for (let c = 0; c < n; c++) for (let r = 0; r <= c; r++) cells.push([c, r]); }
    if (form === 'square') { for (let c = 0; c < n; c++) for (let r = 0; r < n; r++) cells.push([c, r]); }
    if (form === 'row2') { for (let c = 0; c < n; c++) { cells.push([c, 0]); cells.push([c, 1]); } }
    return cells;
  }
  const gridCount = (form, n) => gridCells(form, n).length;
  const GRID_COL = { L: ['#0D9AA3', '#076870'], stairs: ['#7B4FC9', '#55309A'], square: ['#F07C1A', '#B3550A'], row2: ['#1F6FD1', '#144A8F'] };
  function gridSVG(t) {
    const G = t.G || 5, cell = 100 / G, pad = cell * 0.07, col = GRID_COL[t.form];
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${gridCells(t.form, t.n).map(([c, r]) =>
      `<rect x="${(c * cell + pad).toFixed(1)}" y="${(100 - (r + 1) * cell + pad).toFixed(1)}" width="${(cell - 2 * pad).toFixed(1)}" height="${(cell - 2 * pad).toFixed(1)}" rx="${(cell * 0.12).toFixed(1)}" fill="${col[0]}" stroke="${col[1]}" stroke-width="2"/>`).join('')}</svg>`;
  }

  const tCol = id => ({ k: 'col', key: 'col:' + id, name: id, id });
  const tShp = s => ({ k: 'shp', key: 'shp:' + s, name: s, s });
  const tCS = (s, id) => ({ k: 'cs', key: `cs:${s}:${id}`, name: `${id} ${s}`, s, id });
  const tEmo = (e, name) => ({ k: 'emo', key: 'emo:' + e, name, e });
  const tSize = (e, z) => ({ k: 'size', key: 'size:' + z, name: SZ_NAME[z], e, scale: SZ_SCALE[z] });
  const tOrd = (e, name, i, scale) => ({ k: 'size', key: 'ord:' + i, name, e, scale });
  const tTurn = (g, deg) => ({ k: 'turn', key: 'turn:' + deg, name: (g === 'pie' ? PIE_NAME : ARROW_NAME)[deg], g, deg });
  const tTower = n => ({ k: 'tower', key: 'tower:' + n, name: plural(n, 'block', 'blocks'), n });
  const tGrid = (form, n, G) => ({ k: 'grid', key: `grid:${form}:${n}`, name: plural(gridCount(form, n), 'block', 'blocks'), form, n, G });
  const tNum = (v, fmt) => ({ k: 'num', key: 'num:' + r2(v), name: numText(v, fmt), v: r2(v), fmt });
  const names = list => list.map(t => t.name).join(', ');

  function tokenHTML(t) {
    switch (t.k) {
      case 'col': { const c = COLOURS[t.id]; return `<span class="tok"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="36" fill="${c.c}" stroke="${c.d}" stroke-width="6"/></svg></span>`; }
      case 'shp': return `<span class="tok"><svg viewBox="0 0 100 100" aria-hidden="true" fill="#2B4C9B" stroke="#1A2F66" stroke-width="4">${SHAPES[t.s]}</svg></span>`;
      case 'cs': { const c = COLOURS[t.id]; return `<span class="tok"><svg viewBox="0 0 100 100" aria-hidden="true" fill="${c.c}" stroke="${c.d}" stroke-width="5">${SHAPES[t.s]}</svg></span>`; }
      case 'emo': return `<span class="tok"><span class="emo">${t.e}</span></span>`;
      case 'size': return `<span class="tok"><span class="emo" style="font-size:calc(var(--car) * ${t.scale})">${t.e}</span></span>`;
      case 'turn': return `<span class="tok"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${t.deg} 50 50)">${TURN_ART[t.g]}</g></svg></span>`;
      case 'tower': return `<span class="tok tower">${'<i></i>'.repeat(t.n)}</span>`;
      case 'grid': return `<span class="tok grid">${gridSVG(t)}</span>`;
      case 'num': return `<span class="tok"><span class="num${t.name.length >= 5 ? ' xlong' : t.name.length === 4 ? ' long' : ''}">${t.name}</span></span>`;
    }
    return '';
  }

  /* ============================================================
     The train. cells: { t: piece } | { q: true } (the "?") |
     { empty: true, now, ghost } (a carriage to fill) | { dots: true }
     ============================================================ */
  const ENGINE = `<div class="engine" aria-hidden="true"><svg viewBox="0 0 130 112" preserveAspectRatio="xMidYMax meet">
    <path d="M8 90 L8 64 Q8 30 46 24 L118 24 Q124 24 124 30 L124 90 Z" fill="#2d6a4f"/>
    <path d="M19 58 Q23 37 46 34 L58 34 L58 58 Z" fill="#CFE6FF"/>
    <rect x="68" y="34" width="44" height="24" rx="5" fill="#CFE6FF"/>
    <rect x="8" y="68" width="116" height="7" fill="#FFC83D"/>
    <circle cx="16" cy="81" r="4" fill="#FFF6D8"/>
    <rect x="3" y="88" width="126" height="6" rx="3" fill="#1b4332"/>
    <circle cx="36" cy="100" r="10" fill="#33435C" stroke="#fff" stroke-width="3"/>
    <circle cx="98" cy="100" r="10" fill="#33435C" stroke="#fff" stroke-width="3"/>
  </svg></div>`;

  function trainHTML(cells, o = {}) {
    // groups: how many carriages are in each bit (so the train can split into its bits)
    const starts = new Set(), ends = new Set();
    let covered = 0;
    if (o.groups) { for (const g of o.groups) { if (covered > 0) starts.add(covered); covered += g; ends.add(covered - 1); } }
    const labelAt = i => (typeof o.labels === 'function' ? o.labels(i) : o.labels ? o.labels[i] : null);
    const cars = cells.map((c, i) => {
      if (c.dots) return '<div class="gapdots" aria-hidden="true">· · ·</div>';
      const cls = ['car'];
      if (c.q) cls.push('q');
      if (c.empty) cls.push('empty');
      if (c.now) cls.push('now');
      if (i < covered) cls.push('grouped');
      if (starts.has(i)) cls.push('ustart');
      if (ends.has(i)) cls.push('uend');
      if (o.outline && i < o.outline) cls.push('outline');
      if (c.cls) cls.push(c.cls);
      const inner = c.q ? '<span class="qmark">?</span>'
        : c.t ? tokenHTML(c.t)
        : c.ghost ? `<span class="ghost">${tokenHTML(c.ghost)}</span>` : '';
      const hop = o.hops && o.hops[i] ? `<span class="hop${o.hopsOff && o.hopsOff.has(i) ? '' : ' on'}">${esc(o.hops[i])}</span>` : '';
      const text = labelAt(i);
      const lbl = text != null && text !== '' ? `<span class="lbl">${esc(text)}</span>` : '';
      const tap = o.tap ? ` role="button" tabindex="0" aria-label="Carriage ${i + 1}${c.t ? ': ' + esc(c.t.name) : ''}"` : '';
      return `<div class="${cls.join(' ')}" data-i="${i}"${tap}>${inner}<span class="ubar"></span>${hop}${lbl}<span class="wheel l"></span><span class="wheel r"></span></div>`;
    }).join('');
    const tcls = ['train'];
    if (o.tap) tcls.push('tap');
    if (o.tall) tcls.push('tall');
    if (o.split) tcls.push('split', 'units-done');
    if (o.showLbl) tcls.push('show-lbl');
    if (o.showHops) tcls.push('show-hops');
    const us = o.groups && !o.noSplit ? starts.size : 0;
    const style = `--n:${cells.length};--us:${us};${o.tn ? `--tn:${o.tn};` : ''}`;
    return `<div class="train-wrap" data-train="${o.id || ''}"><div class="${tcls.join(' ')}" style="${style}">${ENGINE}${cars}</div><div class="track"></div></div>`;
  }

  // Light up each bit of the train, one after another
  async function lightUnits(tr, groups, split = true) {
    if (!tr || !groups) return;
    if (split) tr.classList.add('split');
    if (!motion()) { tr.classList.add('units-done'); return; }
    const cars = $$('.car', tr);
    await wait(300);
    let a = 0, u = 0;
    for (const g of groups) {
      cars.forEach(c => c.classList.remove('lit'));
      cars.slice(a, a + g).forEach(c => c.classList.add('lit'));
      playSound('unit', u++);
      await wait(430);
      a += g;
    }
    cars.forEach(c => c.classList.remove('lit'));
    tr.classList.add('units-done');
  }

  /* ============================================================
     Tools for making puzzles
     ============================================================ */
  const chunks = (n, p) => { const g = []; for (let a = 0; a < n; a += p) g.push(Math.min(p, n - a)); return g; };
  const spell = unit => [...unit].join(', ');
  const periodOf = keys => { for (let p = 1; p <= keys.length; p++) if (keys.every((k, i) => k === keys[i % p])) return p; return keys.length; };
  // Each level's lists (pattern shapes, steps…) are used in turn, so every one comes up with every kind of puzzle
  const rot = (list, E, c) => list[(c.k + Math.floor(c.k / (E.deckLen || 1))) % list.length];

  let lastTheme = '';
  const capOf = theme => (theme === 'colours' ? 4 : 6);
  function themePool(theme) {
    if (theme === 'colours') return Object.keys(COLOURS).map(tCol);
    if (theme === 'shapes') return Object.keys(SHAPES).map(tShp);
    return EMOJI[theme].map(([e, name]) => tEmo(e, name));
  }
  // n pieces from one set that are easy to tell apart
  function distinct(theme, n) {
    const pool = themePool(theme);
    if (theme !== 'colours') return shuffle(pool).slice(0, n);
    for (let t = 0; t < 80; t++) {
      const got = [];
      for (const x of shuffle(pool)) if (got.length < n && got.every(y => !clash(x.id, y.id))) got.push(x);
      if (got.length === n) return got;
    }
    return shuffle(themePool('shapes')).slice(0, n);
  }
  // Which set of pieces to use: one he likes, big enough, and not the same as last time
  function chooseTheme(need, themes, avoid = []) {
    const all = themes || Object.keys(THEMES);
    let list = all.filter(themeOn);
    if (!list.length) list = all.filter(t => t !== 'flags' || FLAGS_OK);
    if (!list.length) list = all;
    let ok = list.filter(t => capOf(t) >= need);
    if (!ok.length) ok = Object.keys(THEMES).filter(t => capOf(t) >= need && (t !== 'flags' || FLAGS_OK));
    let best = ok.filter(t => t !== lastTheme && !avoid.includes(t));
    if (!best.length) best = ok.filter(t => !avoid.includes(t));
    if (!best.length) best = ok;
    lastTheme = pick(best);
    return lastTheme;
  }
  // Pieces for a pattern: one for each letter, plus spare pieces to use as wrong answers
  function pieces(letters, spare, themes, avoid) {
    const theme = chooseTheme(letters.length + spare, themes, avoid ? [avoid] : []);
    const got = distinct(theme, letters.length + spare);
    const map = {};
    letters.forEach((L, i) => { map[L] = got[i]; });
    return { theme, map, inPat: got.slice(0, letters.length), spare: got.slice(letters.length) };
  }
  // One repeating pattern: its shape (like AAB), its pieces, and ways to read it
  function rep(E, c, want = {}) {
    const unit = E.u || rot(E.units || ['AB'], E, c), p = unit.length, letters = uniq([...unit]);
    const spare = want.spare != null ? want.spare : Math.max(0, (want.ch || 0) - letters.length);
    const S = pieces(letters, spare, E.themes, want.avoid);
    const at = i => S.map[unit[i % p]];
    const row = n => Array.from({ length: n }, (_, i) => at(i));
    return Object.assign(S, { unit, p, letters, at, row, bit: names(row(p)) });
  }
  // The answer, then wrong answers: pieces from the pattern first (so he has to
  // use the pattern), then pieces that aren't in it (only when there's room).
  function choiceSet(answer, primary, n, secondary = []) {
    const seen = new Set([answer.key]), others = [];
    [...shuffle(primary), ...shuffle(secondary)].forEach(t => { if (!seen.has(t.key)) { seen.add(t.key); others.push(t); } });
    return shuffle([answer, ...others.slice(0, Math.max(1, n - 1))]);
  }
  // A messy row that doesn't repeat (and isn't one change away from repeating)
  function noPattern(items, len) {
    const near = keys => {
      for (let p = 1; p <= keys.length / 2; p++) { let d = 0; for (let i = p; i < keys.length; i++) if (keys[i] !== keys[i % p]) d++; if (d <= 1) return true; }
      return false;
    };
    for (let t = 0; t < 400; t++) {
      const seq = Array.from({ length: len }, () => pick(items)), keys = seq.map(x => x.key);
      if (new Set(keys).size < 2 || near(keys)) continue;
      return seq;
    }
    const [a, b] = items;
    return [a, a, b, a, b, b, b, a].slice(0, len);
  }
  // Checks a train he built against a pattern shape. Returns null if it fits, or where it first goes wrong.
  function structureCheck(toks, unit) {
    const map = {}, owner = {};
    for (let i = 0; i < toks.length; i++) {
      const L = unit[i % unit.length], k = toks[i].key;
      if (map[L] === undefined) {
        if (owner[k] !== undefined) return { at: i, letter: L, sameAs: -1 };      // a new letter needs a new thing
        map[L] = k; owner[k] = L;
      } else if (map[L] !== k) return { at: i, letter: L, sameAs: unit.indexOf(L) };
    }
    return null;
  }

  const hintsRepeat = bit => [
    { show: 'outline', text: `Look at the start: ${bit}. That is the bit that repeats. Say it out loud.` },
    { show: 'split', text: 'Now the train is split into its bits. Say each bit, right up to the empty carriage.' },
  ];
  const GHOST_HINT = { show: 'ghost', text: 'The faint one shows what goes next.' };
  const SAY_IT = 'Not quite. Say the pattern out loud, then have another go.';

  /* ============================================================
     The kinds of puzzle. Each one is made up fresh from the level's
     rules (E) – c.k says how far through the level he is, c.helper
     asks for the easier helper version.
     ============================================================ */
  const GEN = {};

  // ---- Repeating patterns ----
  GEN.copy = (E, c) => {
    const R = rep(E, c, { spare: !c.helper && (E.ch || 3) >= 3 ? 1 : 0 });
    const model = 2 * R.p, seq = R.row(model + 2);
    return {
      mech: 'fill', prompt: 'Copy the train.', prompt2: 'Now carry it on. What comes next?',
      model: seq.slice(0, model), modelGroups: chunks(model, R.p),
      seq, slots: range(0, model + 1), phase2: model, ghostAll: !!(E.ghost || c.helper),
      palette: shuffle([...R.inPat, ...R.spare]), groups: chunks(model + 2, R.p), reveal: 'units',
      open: 'Make your train the same as the top train. Tap the pieces in order.',
      wrong: 'Look at the top train. Which one is next?',
      wrong2: 'Not quite. Say the pattern out loud. What comes next?',
      keepGoing: at => (at < model ? 'Good. Keep going: look at the top train.' : 'Yes! And what comes after that?'),
      hints: [GHOST_HINT],
      explain: `You copied it and carried it on. The bit that repeats is ${R.bit}.`,
    };
  };

  GEN.next = (E, c) => {
    const nCh = c.helper ? 2 : (E.ch || 3), R = rep(E, c, { ch: nCh });
    const shown = Math.min(9, 2 * R.p + (c.k % R.p)), seq = R.row(shown + 1), answer = seq[shown];
    return {
      mech: 'choice', prompt: 'What comes next?', seq, hide: shown, answer,
      choices: choiceSet(answer, R.inPat, nCh, R.spare), groups: chunks(shown + 1, R.p), reveal: 'units',
      open: 'Which one goes in the empty carriage?', wrong: SAY_IT, hints: hintsRepeat(R.bit),
      explain: `The bit that repeats is ${R.bit}. So next is ${answer.name}.`,
    };
  };

  GEN.carry = (E, c) => {
    const R = rep(E, c, { spare: !c.helper && (E.ch || 3) >= 3 ? 1 : 0 });
    const n = c.helper ? 2 : (E.carryN || 2), shown = Math.min(2 * R.p + (c.k % R.p), 11 - n), seq = R.row(shown + n);
    return {
      mech: 'fill', prompt: 'Carry on the pattern.', seq, slots: range(shown, shown + n - 1), ghostAll: !!c.helper,
      palette: shuffle([...R.inPat, ...R.spare]), groups: chunks(shown + n, R.p), reveal: 'units',
      open: 'Tap the pieces to fill the empty carriages, in order.',
      wrong: 'Not that one. Say the pattern out loud. What comes next?',
      keepGoing: () => 'Yes! And what comes after that?',
      hints: [hintsRepeat(R.bit)[0], GHOST_HINT],
      explain: `You carried it on. The bit that repeats is ${R.bit}.`,
    };
  };

  GEN.missing = (E, c) => {
    const nCh = c.helper ? 2 : (E.ch || 3), R = rep(E, c, { ch: nCh });
    const len = R.p === 4 ? 9 : 3 * R.p, seq = R.row(len), groups = chunks(len, R.p);
    if ((E.gaps || 1) === 2 && !c.helper) {
      const pairs = [];
      for (let i = R.p; i < len; i++) for (let j = i + 1; j < len; j++) pairs.push([i, j]);
      const [a, b] = pairs[(c.k * 7 + 3) % pairs.length];
      return {
        mech: 'fill', prompt: 'Two are missing. Fill them in.', seq, slots: [a, b],
        palette: shuffle([...R.inPat, ...R.spare.slice(0, 1)]), groups, reveal: 'units',
        open: 'Tap the piece for the first empty carriage.',
        wrong: 'Not that one. Say the pattern out loud.',
        keepGoing: () => 'Yes! Now the next empty carriage.',
        hints: [hintsRepeat(R.bit)[0], GHOST_HINT],
        explain: `The bit that repeats is ${R.bit}. The missing ones are ${seq[a].name} and ${seq[b].name}.`,
      };
    }
    const spots = range(R.p, len - 2), hide = spots[c.k % spots.length], answer = seq[hide];   // never in the first bit, never the last carriage
    return {
      mech: 'choice', prompt: 'What’s missing?', seq, hide, answer,
      choices: choiceSet(answer, R.inPat, nCh, R.spare), groups, reveal: 'units',
      open: 'One carriage is empty. What goes in it?', wrong: SAY_IT, hints: hintsRepeat(R.bit),
      explain: `The bit that repeats is ${R.bit}. So the missing one is ${answer.name}.`,
    };
  };

  // ---- Pattern detective ----
  GEN.unit = (E, c) => {
    const R = rep(E, c, { spare: 0 }), len = R.p === 4 ? 10 : 3 * R.p, seq = R.row(len);
    return {
      mech: 'tap', prompt: 'Where does the pattern start again? Tap that carriage.', seq, shown: seq,
      okAt: i => i > 0 && i % R.p === 0, markAt: R.p, groups: chunks(len, R.p), reveal: 'units',
      open: 'The pattern begins at the start. Find where it starts again.',
      wrongAt: i => (i === 0 ? 'That is where it begins. Where does it start again?' : `Not there. Say it out loud: ${R.bit}. Then it starts again.`),
      hints: [
        { text: 'Say the pattern out loud. Listen for when it starts again.' },
        { show: 'outline', text: `This is the first bit: ${R.bit}. Tap the carriage after it.` },
      ],
      explain: `It starts again here. The bit that repeats is ${R.bit}. It is ${R.p} carriages long.`,
    };
  };

  GEN.bit = (E, c) => {
    const R = rep(E, c, { spare: 0 }), len = R.p === 4 ? 8 : 3 * R.p, seq = R.row(len);
    // The right group, one that is too long and one that is too short
    let opts = [{ toks: seq.slice(0, R.p), right: true }, { toks: seq.slice(0, R.p + 1) }, { toks: seq.slice(0, R.p - 1) }];
    if (c.helper) opts = opts.slice(0, 2);
    const ask = 'Say the pattern out loud. Which group can you say again and again?';
    return {
      mech: 'option', style: 'groups', prompt: 'Which bit repeats?', seq, opts: shuffle(opts),
      groups: chunks(len, R.p), reveal: 'units',
      open: 'Find the group that comes again and again.', wrong: 'Not quite. ' + ask,
      hints: [{ text: ask }, { show: 'split', text: 'Now the train is split into its bits. Find the group that matches one bit.' }],
      explain: `The bit that repeats is ${R.bit}. It is ${R.p} long.`,
    };
  };

  GEN.is = (E, c) => {
    const R = rep(E, c, { spare: 0 }), yes = c.demo ? true : Math.random() < 0.5;
    const len = yes ? clamp(3 * R.p, 6, 9) : 6 + rand(3);
    const seq = yes ? R.row(len) : noPattern(R.inPat, len);
    return {
      mech: 'text', prompt: 'Is this a repeating pattern?', seq,
      options: [{ label: '✔ Yes, it repeats', right: yes }, { label: '✖ No, it doesn’t', right: !yes }],
      groups: yes ? chunks(len, R.p) : null, reveal: yes ? 'units' : 'none',
      open: 'A pattern repeats the same bit, again and again.',
      wrong: 'Not quite. Look for a bit that comes back again and again.',
      hints: [{ text: 'Look at the first few. Do they come back again and again, in the same order?' }],
      explain: yes ? `It repeats! The bit that repeats is ${R.bit}.` : 'It doesn’t repeat. No bit comes back in the same order.',
    };
  };

  GEN.fix = (E, c) => {
    const R = rep(E, c, { spare: 1 }), len = R.p === 4 ? 10 : 3 * R.p, seq = R.row(len);
    const spots = range(R.p, len - 1), at = spots[(c.k * 3 + 1) % spots.length];
    // An easier one swaps in a piece that isn't in the pattern at all; a harder one uses a piece from the pattern
    const foreign = (E.w === 'extra' || c.helper) && R.spare[0];
    const bad = foreign ? R.spare[0] : pick(R.inPat.filter(t => t.key !== seq[at].key));
    const shown = seq.slice(); shown[at] = bad;
    return {
      mech: 'tap', prompt: 'One carriage is wrong. Tap it.', seq, shown, okAt: i => i === at, fix: { at }, markAt: at,
      groups: chunks(len, R.p), reveal: 'units',
      open: 'Say the pattern out loud. Which one doesn’t fit?',
      wrongAt: () => 'That one fits the pattern. Say it out loud and listen for the odd one.',
      hints: [
        { show: 'outline', text: `The bit that repeats is ${R.bit}. Check each carriage, one by one.` },
        { show: 'split', text: 'Now the train is split into its bits. Which bit looks different?' },
      ],
      explain: `That one should be ${seq[at].name}. The bit that repeats is ${R.bit}.`,
    };
  };

  const SAME_OTHERS = {
    AB: ['AAB', 'ABB'], AAB: ['ABB', 'AB'], ABB: ['AAB', 'AB'], ABC: ['AABC', 'ABCC', 'ABBC'],
    AABB: ['AAB', 'ABB', 'AB'], ABCC: ['ABC', 'AABC', 'ABBC'], ABBC: ['ABC', 'ABCC', 'AABC'],
    AABC: ['ABC', 'ABCC', 'ABBC'], ABCD: ['ABCC', 'AABC', 'ABC'],
  };
  GEN.same = (E, c) => {
    const R = rep(E, c, { spare: 0 });
    const others = shuffle(SAME_OTHERS[R.unit] || ['AB', 'AAB']).slice(0, c.helper ? 1 : 2);
    const len = [R.unit, ...others].some(u => u.length >= 4 || uniq([...u]).length >= 3) ? 8 : 6;
    // The trains to choose from use different things, so only the pattern can match
    const t2 = chooseTheme(4, null, [R.theme]), t3 = chooseTheme(4, null, [R.theme, t2]);
    const make = (u, theme) => {
      const ls = uniq([...u]), got = distinct(theme, ls.length);
      return Array.from({ length: len }, (_, i) => got[ls.indexOf(u[i % u.length])]);
    };
    const opts = [{ u: R.unit, seq: make(R.unit, t2), right: true }, { u: others[0], seq: make(others[0], t2) }];
    if (others[1]) opts.push({ u: others[1], seq: make(others[1], t3) });
    return {
      mech: 'option', prompt: 'Which train has the same pattern?', seq: R.row(len), opts: shuffle(opts),
      labels: i => R.unit[i % R.p], groups: chunks(len, R.p), reveal: 'same',
      open: 'The things are different. Is the pattern the same?',
      wrong: 'Not quite. Look for the train that changes in the same places.',
      hints: [{ show: 'labels', text: `This train goes ${spell(R.unit)}. Find the train that goes the same way.` }],
      explain: `Both trains go ${spell(R.unit)}. Different things, same pattern.`,
    };
  };

  // ---- Making patterns ----
  GEN.make = (E, c) => {
    const R = rep(E, c, { spare: 0 }), n = Math.max(6, 2 * R.p), model = R.row(n);
    const N = pieces(R.letters, 0, null, R.theme);                 // new things, from a different set
    const letter = i => R.unit[i % R.p];
    return {
      mech: 'build', prompt: 'Make the same pattern with these.', n, unit: R.unit,
      model, modelGroups: chunks(n, R.p), modelLabels: letter, labels: letter,
      palette: shuffle(N.inPat), groups: chunks(n, R.p), reveal: 'units',
      open: 'Tap the pieces to fill your train. Then press Check.',
      hints: [{ show: 'letters', text: `The top train goes ${spell(R.unit)}. Use one thing for each letter, and always the same thing for the same letter.` }],
      check(toks) {
        const bad = structureCheck(toks, R.unit);
        if (!bad) return { ok: true };
        const no = bad.at + 1;
        return { ok: false, cut: bad.at, msg: `Carriage ${no} didn’t fit, so I took it off. ` + (bad.sameAs >= 0
          ? `In the top train, carriage ${no} is the same as carriage ${bad.sameAs + 1}.`
          : `In the top train, carriage ${no} is something new. Use a different thing.`) };
      },
      explainBuilt: () => `Your train goes ${spell(R.unit)}, just like the top train. Different things, same pattern.`,
      solution: () => range(0, n - 1).map(i => N.map[letter(i)]),
    };
  };

  GEN.letters = (E, c) => {
    const unit = c.helper ? 'AB' : (E.u || rot(E.units || ['ABB'], E, c)), p = unit.length, ls = uniq([...unit]);
    const S = pieces(ls, c.helper ? 0 : 1, E.themes), n = Math.max(6, 2 * p);
    const letter = i => unit[i % p];
    return {
      mech: 'build', prompt: `Make an ${[...unit].join(' ')} pattern.`, n, unit,
      labels: letter, lblOn: true, palette: shuffle([...S.inPat, ...S.spare]), groups: chunks(n, p), reveal: 'units',
      open: 'Each letter is one kind of thing. Tap the pieces to fill the train, then press Check.',
      hints: [{ text: 'Pick one thing for A. Use it every time you see A. Then pick a different thing for B.' }],
      check(toks) {
        const bad = structureCheck(toks, unit);
        if (!bad) return { ok: true };
        const no = bad.at + 1;
        return { ok: false, cut: bad.at, msg: `Carriage ${no} didn’t fit, so I took it off. ` + (bad.sameAs >= 0
          ? `It is ${bad.letter} again, so use the same thing as carriage ${bad.sameAs + 1}.`
          : `It is ${bad.letter}, and ${bad.letter} must be a different thing from the other letters.`) };
      },
      explainBuilt: toks => `Your train goes ${spell(unit)}. ${listNames(ls.map(L => `${L} is ${toks[unit.indexOf(L)].name}`))}.`,
      solution: () => range(0, n - 1).map(i => S.map[letter(i)]),
    };
  };

  GEN.own = (E, c) => {
    const theme = chooseTheme(4, E.themes), palette = distinct(theme, theme === 'colours' ? 4 : 5);
    const wantP = c.helper ? 0 : (E.ownP || 0);
    const example = wantP === 4 ? 'AABC' : wantP === 3 ? 'AAB' : 'AB';
    const egNames = names([...example].map(L => palette['ABC'.indexOf(L)]));
    return {
      mech: 'build', max: 10, min: wantP ? wantP * 2 : 4, palette, reveal: 'units',
      prompt: wantP ? `Make your own pattern. The bit that repeats must be ${wantP} long.` : 'Make your own pattern.',
      groupsFn: toks => chunks(toks.length, periodOf(toks.map(t => t.key))),
      open: 'Tap the pieces to add carriages. Make a bit, then make it again. Then press Check.',
      hints: [{ text: `Make a short bit, like ${egNames}. Then make the same bit again, and again.` }],
      check(toks) {
        const keys = toks.map(t => t.key), p = periodOf(keys);
        if (uniq(keys).length < 2) return { ok: false, msg: 'Use at least 2 different things.' };
        if (p * 2 > keys.length) return { ok: false, msg: 'It doesn’t repeat yet. Make a bit, then make the same bit again.' };
        if (wantP && p !== wantP) return { ok: false, msg: `Your bit is ${p} long. Make the bit that repeats ${wantP} long.` };
        return { ok: true };
      },
      explainBuilt(toks) {

    const toks = vals.map(v => tNum(v)), last = vals.length - 1, ans = vals[last], prev = vals[last - 1], jumpNow = prev - vals[last - 2];
    const hint = { show: 'hops', text: 'Look at the jumps. They are not all the same. How do the jumps change?' };
    if (E.mode === 'rule') {
      const steady = `${jumpNow > 0 ? '+' : '−'} ${Math.abs(jumpNow)} each time`;
      return {
        mech: 'text', prompt: 'What’s the rule?', seq: toks,
        options: shuffle([{ label: rule, right: true }, { label: steady }, ...(c.helper ? [] : [{ label: other }])]),
        hops: hopsOf(vals), hopsAfter: after, reveal: 'hops',
        open: 'How do the numbers change? Look closely: the jumps are not all the same.',
        wrong: 'Not quite. Check the rule against every number.',
        hints: [hint],
        explain: `${why} The rule is “${rule}”.`,
      };
    }
    const cand = uniq([prev + jumpNow, ans + 1, ans - 1, prev + 1, ans + 2, ans + jumpNow]).filter(v => v > 0 && v !== ans && !vals.slice(0, last).includes(v));
    return {
      mech: 'choice', prompt: 'What comes next?', seq: toks, hide: last, answer: toks[last],
      choices: shuffle([ans, ...cand.slice(0, c.helper ? 1 : 2)]).map(v => tNum(v)),
      hops: hopsOf(vals), hopsAfter: after, reveal: 'hops',
      open: 'Look at how the numbers change. The jumps are not all the same.',
      wrong: 'Not quite. Look at how the jumps change.',
      hints: [hint],
      explain: kind === 'fib' ? `${why} ${vals[last - 2]} + ${prev} = ${ans}.` : `${why} So next is ${ans}.`,
    };
  };

  GEN.two = (E, c) => {
    // The colours follow one pattern and the shapes follow another, so both have to be tracked
    const three = pick(['ABC', 'AAB', 'ABB']), flip = c.k % 2 === 1;
    const cu = flip ? three : 'AB', su = flip ? 'AB' : three, cl = uniq([...cu]), sl = uniq([...su]);
    const cols = distinct('colours', cl.length).map(t => t.id), shps = shuffle(Object.keys(SHAPES)).slice(0, sl.length);
    const colAt = i => cols[cl.indexOf(cu[i % cu.length])], shpAt = i => shps[sl.indexOf(su[i % su.length])];
    const shown = 6 + (c.k % 3), seq = range(0, shown).map(i => tCS(shpAt(i), colAt(i))), answer = seq[shown];
    const oc = pick(cols.filter(x => x !== answer.id)), os = pick(shps.filter(x => x !== answer.s));
    const wrongs = [tCS(os, oc), tCS(os, answer.id), tCS(answer.s, oc)];
    return {
      mech: 'choice', prompt: 'What comes next?', seq, hide: shown, answer,
      choices: shuffle([answer, ...(c.helper ? wrongs.slice(0, 1) : wrongs)]), reveal: 'none',
      open: 'Two things change here: the colour and the shape.',
      wrong: 'Not quite. Check the colour, then check the shape.',
      hints: [
        { text: 'Look at just the colours. Say them out loud. What colour comes next?' },
        { text: 'Now look at just the shapes. Say them out loud. What shape comes next?' },
      ],
      explain: `The colours go ${range(0, cu.length - 1).map(colAt).join(', ')}. The shapes go ${range(0, su.length - 1).map(shpAt).join(', ')}. So next is: ${answer.name}.`,
    };
  };

  const countIn = (p, upto) => {
    const a = range(1, Math.floor(upto / p)).map(i => i * p);
    return a.length > 6 ? `${a.slice(0, 3).join(', ')} … ${a[a.length - 1]}` : a.join(', ');
  };
  GEN.far = (E, c) => {
    const R = rep(E, c, { ch: 3 }), p = R.p, m = 2 * p;
    const base = { mech: 'choice', hide: -1, lblOn: true, reveal: 'units', open: 'The numbers show which carriage is which.' };
    if (E.near || c.helper) {
      // A few carriages ahead: the empty carriages are drawn, so he can carry the pattern on
      const N = Math.min(m + 2 + (c.k % 3), 11), full = R.row(N), answer = full[N - 1];
      return Object.assign(base, {
        prompt: `What will be in carriage ${N}?`, seq: full, answer,
        cells: full.map((t, i) => (i < m ? { t } : i === N - 1 ? { q: true } : { empty: true })),
        cellsAfter: full.map((t, i) => (i < m ? { t } : { t, cls: i === N - 1 ? 'filled just' : 'filled' })),
        labels: range(1, N).map(String), groups: chunks(N, p),
        choices: choiceSet(answer, R.inPat, c.helper ? 2 : Math.max(3, R.letters.length), R.spare),
        wrong: 'Not quite. Carry the pattern on, one carriage at a time.',
        hints: [
          { text: 'Carry the pattern on in your head. Point at each empty carriage as you say it.' },
          { show: 'split', text: `The bit that repeats is ${R.bit}. Say it again for the empty carriages.` },
        ],
        explain: `Carry the pattern on: ${names(full.slice(m))}. So carriage ${N} is ${answer.name}.`,
      });
    }
    // Far ahead: the carriage isn't drawn, so he counts in steps the size of the bit
    const N = m + 3 + ((c.k * 5 + rand(3)) % 10), answer = R.at(N - 1);
    const full = Math.floor((N - 1) / p), r = ((N - 1) % p) + 1, first = R.row(m).map(t => ({ t }));
    return Object.assign(base, {
      prompt: `What will be in carriage ${N}?`, seq: R.row(m), answer,
      cells: [...first, { dots: true }, { q: true }],
      cellsAfter: [...first, { dots: true }, { t: answer, cls: 'filled just' }],
      labels: [...range(1, m).map(String), '', String(N)], groups: chunks(m, p),
      choices: choiceSet(answer, R.inPat, Math.max(3, R.letters.length), R.spare),
      wrong: `Not quite. The bit is ${p} long. Count in ${p}s to get near carriage ${N}.`,
      hints: [
        { show: 'split', text: `The bit that repeats is ${p} long. Count in ${p}s to get close to ${N}: ${countIn(p, N)}.` },
        { text: r === p ? `A bit ends at carriage ${N}. What is the last thing in the bit?` : `A bit ends at carriage ${full * p}. Count on from there to carriage ${N}.` },
      ],
      explain: r === p
        ? `The bit is ${p} long. Count in ${p}s: ${countIn(p, N)}. Carriage ${N} is the end of a bit, so it is ${answer.name}.`
        : `The bit is ${p} long. Count in ${p}s: ${countIn(p, N)}. A bit ends at carriage ${full * p}, so carriage ${N} is number ${r} in the next bit: ${answer.name}.`,
    });
  };

  /* ============================================================
     Stages and levels. Every level is designed: "deck" is the kinds
     of puzzle he meets, in order, round and round. The pieces and
     numbers are made up fresh each time, so the same level never
     gives the same puzzle twice.
       win, need – he moves up when "need" of his last "win" puzzles
                   at this level were right first time, on his own,
                   with at least one of every kind in the deck
     ============================================================ */
  const STAGES = [
    { n: 1, emoji: '🚂', name: 'Copy and carry on', school: 'Nursery and Reception',
      fact: 'A pattern is something that repeats, in the same order, again and again.' },
    { n: 2, emoji: '🧱', name: 'Bigger bits', school: 'Reception and Year 1',
      fact: 'The bit that repeats can be 2, 3 or 4 things long.' },
    { n: 3, emoji: '🔍', name: 'Pattern detective', school: 'Reception to Year 2',
      fact: 'Find the bit that repeats and you know the whole pattern, even when it is made with different things.' },
    { n: 4, emoji: '📏', name: 'Size, turns and growing', school: 'Year 1 and Year 2',
      fact: 'Some patterns grow or shrink. Each one changes by the same amount.' },
    { n: 5, emoji: '🔢', name: 'Number patterns', school: 'Year 1 to Year 3',
      fact: 'Number patterns go up or down by the same amount each time.' },
    { n: 6, emoji: '🧠', name: 'Rule finder', school: 'Year 3 to Year 6',
      fact: 'The rule tells you how to get from one number to the next, like “+ 3 each time”.' },
    { n: 7, emoji: '🏅', name: 'Pattern master', school: 'Year 5, Year 6 and beyond',
      fact: 'Some patterns have two rules at once, or jumps that grow. Look for what stays the same and what changes.' },
  ];

  const LADDER = [
    // ---- Stage 1: two things taking turns ----
    { st: 1, win: 5, need: 4, ch: 2, units: ['AB'], themes: ['colours'], ghost: true,
      deck: ['copy', 'next', 'carry', 'next'],
      desc: 'Copy a two-colour train with a faint guide, then say what comes next (2 answers).' },
    { st: 1, win: 5, need: 4, ch: 2, units: ['AB'], themes: ['colours', 'shapes', 'animals'],

    { st: 1, win: 5, need: 4, ch: 3, units: ['AB'], carryN: 3,

      deck: ['copy', 'next', 'missing', 'carry', 'next'],

    { st: 2, ch: 3, units: ['ABC', 'AABB'], carryN: 3,
      deck: ['next', 'missing', 'carry', 'next', 'missing'],
      desc: 'Three different things (A B C) and pairs (A A B B).' },
    { st: 2, ch: 4, units: ['ABCC', 'ABBC', 'AABC', 'ABCD'], carryN: 3,

    // ---- Stage 3: pattern detective ----
    { st: 3, units: ['AB', 'ABC', 'AAB', 'ABB'],

    { st: 3, units: ['AB', 'AAB', 'ABB', 'ABC'],

<!doctype html>
<html lang="en-GB" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Patterns: eight worlds of pattern puzzles, from copying a train to number rules.">
<title>Patterns – Learning Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css?v=6">
<style>
  /* Patterns: one calm screen. Plain backgrounds, so the pieces are what you notice. */
  :root {
    --ink: #26324B; --soft: #6B5A45; --paper: #FFFDF8; --line: #E6DAC6; --edge: #E2D5BF;
    --gold: #F4C452; --gold-ink: #6B4A00; --go: #2E7D4F; --go-edge: #1F5C39; --blue: #2F5DA8;
    --q: #E0A030; --q-bg: #FFF6DA;
    --opt: clamp(64px, 12.5dvh, 104px); --mini: clamp(28px, 5.6dvh, 44px);
  }
  html, body { height: 100%; }
  body { background: #F5EFE4; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: var(--ink); }
  button { font-family: inherit; }

  /* ---------- top bar ---------- */
  .ptop { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--paper); border-bottom: 2px solid #EDE3D2; }
  .pbtn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 12px; border-radius: 999px; background: #FFFFFF;
    border: 2px solid var(--line); box-shadow: 0 3px 0 var(--edge); font: 800 17px/1 var(--font); color: var(--ink); text-decoration: none; cursor: pointer; flex: none; }
  .pbtn:hover { background: #FFFBF3; }
  .pbtn.round { width: 46px; padding: 0; justify-content: center; }
  .pbtn .ic { display: inline-flex; }
  .ptitle { display: flex; flex-direction: column; gap: 4px; margin-left: 4px; min-width: 0; }
  .ptitle h1 { font-size: 25px; line-height: 1; color: var(--ink); }
  .sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px 0 4px; border-radius: 999px; font: 800 14px/1 var(--font); white-space: nowrap; }
  .chip svg { width: 20px; height: 20px; }
  .chip.world { background: color-mix(in srgb, var(--wc) 16%, #FFFFFF); border: 2px solid color-mix(in srgb, var(--wc) 40%, #FFFFFF); color: var(--ink); }
  .chip.lvl { background: var(--ink); color: #FFFFFF; padding: 0 11px; }
  .meter { display: inline-block; width: 96px; height: 10px; border-radius: 999px; background: #EDE3D2; overflow: hidden; vertical-align: middle; }
  .meter span { display: block; height: 100%; border-radius: 999px; background: var(--gold); transition: width .5s; }
  .spacer { flex: 1 1 0; }
  .dots { display: flex; align-items: center; gap: 5px; list-style: none; margin: 0; padding: 0; flex: none; }
  .dot { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .dot span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #D8CBB2; box-sizing: border-box; }
  .dot.soft span { background: #B9C4D4; border-color: #B9C4D4; }
  .dot.now { border-radius: 50%; border: 3px solid var(--blue); color: var(--blue); font: 900 13px/1 var(--font); }
  .stars { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px 0 10px; border-radius: 999px; background: #FFF3CF;
    border: 2px solid #F2D27A; font: 700 21px/1 var(--font); color: var(--gold-ink); flex: none; }

  /* ---------- the stage ---------- */
  .stage { flex: 1 1 0; min-height: 0; margin: 12px 16px 0; border-radius: 26px; background: var(--paper); position: relative; overflow: hidden;
    box-shadow: 0 0 0 3px #E9DDC9, 0 7px 0 #E2D2B6; display: flex; flex-direction: column; }
  .screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #play { background: var(--tint, #F3F0EA); }
  .banner { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--blue); color: #FFFFFF; }
  .banner.done { background: var(--go); }
  .b-eye { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; flex: none; }
  .b-big { font: 700 clamp(19px, 3.4dvh, 27px)/1.15 var(--font); }
  .b-small { font: 800 16px/1.2 var(--font); color: #DCE8FF; }
  .b-new { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 6px 15px 6px 10px; border-radius: 999px; background: #FFD66B; color: #3A2A00; font: 900 16px/1 var(--font); white-space: nowrap; }
  .qrow { flex: none; display: flex; align-items: center; gap: 12px; padding: clamp(8px, 2dvh, 16px) 24px 0; flex-wrap: wrap; }
  .q { font: 700 clamp(22px, 4.2dvh, 36px)/1.15 var(--font); color: var(--ink); }
  .flavour { padding: 5px 13px; border-radius: 999px; font: 800 15px/1 var(--font); background: #EEF0FA; color: #3A4A8C; }
  .flavour[data-kind="warm"] { background: #FFEFD6; color: #7A4A00; }
  .flavour[data-kind="review"] { background: #E2F3F4; color: #076870; }
  .flavour[data-kind="practice"] { background: #FFF4CC; color: #6B4A00; }
  .scene { flex: 1 1 0; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; padding: 6px 16px; }
  .scene > * { max-width: 100%; }
  .answers { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; padding: 4px 16px clamp(10px, 2dvh, 18px); min-height: calc(var(--opt) + 16px); }
  .answers:empty { min-height: 10px; padding: 0; }

  /* ---------- answer buttons, palette, tools ---------- */
  .opt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0; border-radius: 22px; background: #FFFFFF; color: var(--ink);
    border: 3px solid var(--line); box-shadow: 0 5px 0 var(--edge); cursor: pointer; transition: translate .12s, box-shadow .12s, opacity .2s; }
  .opt:not([disabled]):not([aria-disabled="true"]):hover { translate: 0 -2px; box-shadow: 0 7px 0 var(--edge); }
  .opt:not([disabled]):not([aria-disabled="true"]):active { translate: 0 3px; box-shadow: 0 2px 0 var(--edge); }
  .opt.k-tok { width: var(--opt); height: var(--opt); }
  .opt.k-tok .pc { width: 80%; height: 80%; }
  .opt.k-wide { padding: 10px 14px; min-height: calc(var(--opt) * .8); }
  .opt.k-pic { flex-direction: column; padding: 8px 12px; min-width: var(--opt); min-height: var(--opt); }
  .opt.k-text, .opt.k-card { padding: 10px 22px; min-height: calc(var(--opt) * .62); font: 800 clamp(17px, 2.6dvh, 23px)/1.2 var(--font); }
  .opt.k-card { background: #FBFAFF; border-color: #D8D0EE; box-shadow: 0 5px 0 #D5CDEE; }
  .otext.letters { letter-spacing: .14em; }
  .otext.small { font: 800 13px/1.15 var(--font); max-width: 9em; text-align: center; }
  .opt.right { border-color: #4CAF7A; box-shadow: 0 5px 0 #3D8C62, 0 0 0 5px #D6F0DF; background: #F2FAF5; }
  .opt.gone { opacity: .35; }
  .opt[disabled] { cursor: default; }
  .answers.locked .opt, .answers.locked .tool { opacity: .6; cursor: default; }
  .mini { display: flex; gap: 4px; }
  .mini .mc { width: var(--mini); height: var(--mini); display: flex; align-items: center; justify-content: center; background: #FFFDF9; border: 2px solid #E6DCCB; border-radius: 10px; }
  .mini .mc .pc { width: 84%; height: 84%; }
  .mini.tiles .mc, .mini.quad .mc { background: none; border: 0; }
  .mini.tiles .mc .pc, .mini.quad .mc .pc { width: 100%; height: 100%; }
  .mini.quad { display: grid; grid-template-columns: repeat(2, var(--mini)); gap: 3px; }
  .ofig { --u: clamp(9px, 2.1dvh, 17px); display: flex; align-items: flex-end; }
  .opt .pic { width: calc(var(--opt) * 1.05); height: calc(var(--opt) * 1.05); }
  .pal { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .tools { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .tool { display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; border-radius: 16px; background: #FFFFFF; color: var(--ink);
    border: 2px solid var(--line); box-shadow: 0 4px 0 var(--edge); font: 800 18px/1 var(--font); cursor: pointer; text-decoration: none; flex: none; }
  .tool.check { background: var(--go); border-color: var(--go); color: #FFFFFF; box-shadow: 0 4px 0 var(--go-edge); }
  .tool[disabled] { opacity: .45; cursor: default; }
  .tool.warn { border-color: #E5B3A8; color: #8A3B2C; }

  /* ---------- a line: train, stones, cards ---------- */
  .ln { --gap: clamp(5px, 1cqw, 10px); --eng: 0; --cap: clamp(108px, 7.6cqw, 144px); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 5cqh, 40px);
    --car: min(var(--cap), calc((100cqw - 30px - (var(--n) + 1) * var(--gap)) / (var(--n) + var(--eng))), calc((100cqh - var(--rows) * 70px) / var(--rows) / 1.15)); }
  .ln-train { --eng: 1.3; }
  .ln-stones { --cap: clamp(100px, 7cqw, 132px); --gap: clamp(10px, 2cqw, 22px); }
  .ln-cards { --cap: clamp(116px, 8cqw, 152px); --gap: clamp(8px, 1.6cqw, 16px); }
  .ln.roomy { --cap: clamp(150px, 10cqw, 190px); --gap: clamp(14px, 3cqw, 30px); }
  .ln-row { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ln-label { align-self: flex-start; font: 800 16px/1 var(--font); color: var(--soft); }
  .ln-track { position: relative; display: flex; align-items: flex-end; gap: var(--gap); padding-bottom: calc(var(--car) * .13); }
  .ln-train .ln-track::after { content: ''; position: absolute; left: -8px; right: -8px; bottom: 0; height: 3px; border-radius: 2px; background: #D3C8B5; }
  .ln .engine { width: calc(var(--car) * 1.3); height: calc(var(--car) * .997); flex: none; margin-bottom: calc(var(--car) * -.13 + 2px); }
  .car { position: relative; width: var(--car); flex: none; display: flex; flex-direction: column; align-items: center; padding: 0; border: 0; background: none; color: inherit; }
  button.car { cursor: pointer; }
  .car .box { position: relative; width: var(--car); height: var(--car); box-sizing: border-box; border-radius: 20%; background: #FFFDF9; border: 3px solid #E4D9C6;
    display: flex; align-items: center; justify-content: center; }
  .car .box .pc { width: 80%; height: 80%; }
  .ln-train .car .box::before, .ln-train .car .box::after { content: ''; position: absolute; bottom: calc(var(--car) * -.14); width: calc(var(--car) * .17); height: calc(var(--car) * .17);
    border-radius: 50%; background: radial-gradient(circle, #AEB8C6 0 27%, #3A4150 30%); }
  .ln-train .car .box::before { left: 14%; } .ln-train .car .box::after { right: 14%; }
  .ln-train .car::before { content: ''; position: absolute; left: calc(-1 * var(--gap) - 3px); width: calc(var(--gap) + 6px); top: 74%; height: 4px; border-radius: 2px; background: #8C95A5; }
  .ln-stones .car .box { background: none; border: 0; }
  .ln-beads { --cap: clamp(84px, 6cqw, 112px); --gap: clamp(4px, .8cqw, 8px); }
  .ln-beads .ln-track::after { content: ''; position: absolute; left: -12px; right: -12px; top: calc(var(--car) * .5 - 1px); height: 3px; border-radius: 2px; background: #B98C63; }
  .ln-beads .car { z-index: 1; }
  .ln-beads .car .box { background: none; border: 0; }
  .ln-beads .car .box .pc { width: 88%; height: 88%; rotate: -90deg; }
  .ln .car.later .box { border: 0; background: none; }
  .ln .car.later .box::after { content: ''; width: 28%; height: 28%; border-radius: 50%; background: #D9CBB4; }
  .ln-stones .car .box .pc { width: 100%; height: 100%; }
  .ln-cards .car .box { border-radius: 18%; }
  .ln.roomy .car .box .pc { width: 72%; height: 72%; }
  .qm { font: 700 clamp(18px, calc(var(--car, 80px) * .5), 52px)/1 var(--font); color: #C47F0E; }
  .car.q .box, .car.gap .box, .car.empty .box { border-style: dashed; }
  .car.q .box { border-color: var(--q); background: var(--q-bg); }
  .car.gap .box, .car.empty .box { border-color: #BFB4A1; background: rgba(255,255,255,.6); }
  .car.gap.now .box, .car.empty.now .box { border-color: var(--blue); background: #EEF4FC; animation: nowpulse 1.6s ease-in-out infinite; }
  .car.filled .box { border-style: solid; border-color: #E4D9C6; background: #FFFDF9; }
  .car.shown .box { opacity: .75; }
  .ln-stones .car.q .box { border: 3px dashed var(--q); background: var(--q-bg); border-radius: 26%; }
  .ghost { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; opacity: .3; }
  .car.dim .box { opacity: .45; }
  .car.nope .box { border-color: #E9A04B; background: #FFF4E6; }
  .car.right .box { border-color: #4CAF7A; box-shadow: 0 0 0 5px #D6F0DF; }
  .car.far { margin-left: 4px; }
  .far-gap { align-self: center; font: 700 clamp(20px, calc(var(--car, 60px) * .45), 40px)/1 var(--font); color: #A89A82; padding: 0 2px; }
  .car .ubar { position: absolute; left: 0; right: calc(-1 * var(--gap)); top: calc(100% + var(--car) * .22); height: 8px; background: #F2BC4E; }
  .car.ustart .ubar { left: 7%; border-radius: 4px 0 0 4px; }
  .car.uend .ubar { right: 7%; border-radius: 0 4px 4px 0; }
  .car.ustart.uend .ubar { border-radius: 4px; }
  .lbl { position: absolute; top: calc(100% + var(--car) * .22 + 12px); font: 800 clamp(15px, calc(var(--car) * .28), 24px)/1 var(--font); color: var(--blue); }
  .pos { position: absolute; top: calc(100% + var(--car) * .2); font: 800 15px/1 var(--font); color: #8A7A62; }
  .show-units .pos { top: calc(100% + var(--car) * .22 + 14px); }
  .hop { position: absolute; top: -30px; left: calc(var(--gap) * -.5 - 26px); width: 52px; text-align: center; font: 800 15px/1.5 var(--font); color: #7A4A00; background: #FFF0C8; border-radius: 999px; z-index: 2; }
  .hop.turn { font-size: 18px; }
  .rule-card { font: 800 22px/1 var(--font); background: #FFFFFF; border: 2px solid #D8D0EE; border-radius: 14px; padding: 8px 16px; color: #4A3A7A; }

  /* ---------- the necklace ---------- */
  .ring-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .ring { position: relative; width: min(100cqh - 6px, 100cqw - 6px, 560px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, #EAF1F7 0 60%, #E1EAF2 61% 63.5%, transparent 64%); }
  .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-svg .cord { fill: none; stroke: #B98C63; stroke-width: .7; }
  .ring-svg .uarc { fill: none; stroke: #F7D57E; opacity: .8; }
  .ring-svg .clasp { fill: #FFFFFF; stroke: #D6A12A; stroke-width: 1; }
  .ring-svg .join circle { fill: #4CAF7A; } .ring-svg .join.bad circle { fill: #E9A04B; }
  .ring-svg .join path { fill: none; stroke: #FFFFFF; stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; }
  .bead { position: absolute; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  button.bead { cursor: pointer; }
  .bead .box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .bead .pc { width: 100%; height: 100%; }
  .bead.q, .bead.gap { border: 3px dashed var(--q); background: var(--q-bg); }
  .bead.gap { border-color: #BFB4A1; background: rgba(255,255,255,.75); }
  .bead.gap.now { border-color: var(--blue); background: #EEF4FC; animation: nowpulse 1.6s ease-in-out infinite; }
  .bead.q .box, .bead.gap .box { transform: none !important; }
  .bead .qm { font-size: clamp(16px, 4cqmin, 30px); }
  .bead.filled, .bead.just { border: 0; background: none; }
  .bead.later { background: #D9CBB4; scale: .26; }
  .bead.nope .box { filter: drop-shadow(0 0 4px #E9A04B); }
  .bead.right { box-shadow: 0 0 0 4px #BFE6CC; }

  /* ---------- grids ---------- */
  .gridw { --g: clamp(3px, .8cqmin, 6px); --cap: clamp(92px, 6cqw, 116px); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    --cell: min(var(--cap), calc((100cqw - 16px) / var(--w) - var(--g)), calc((100cqh - 16px) / var(--h) - var(--g))); }
  .gk-num { --cap: clamp(52px, 3.6cqw, 66px); --g: 4px; }
  .gk-matrix { --cap: clamp(118px, 8cqw, 150px); --g: 10px; }
  .gk-mirror { --cap: clamp(72px, 4.8cqw, 92px); --g: 3px; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--cell)); grid-auto-rows: var(--cell); gap: var(--g); }
  .cell { position: relative; width: var(--cell); height: var(--cell); padding: 0; border: 0; background: none; border-radius: 16%; display: flex; align-items: center; justify-content: center; color: inherit; }
  button.cell { cursor: pointer; }
  .cell > .pc { width: 100%; height: 100%; }
  .gk-tile .cell.q, .gk-tile .cell.gap { border: 3px dashed #BFB4A1; background: rgba(255,255,255,.7); }
  .gk-tile .cell.q { border-color: var(--q); background: var(--q-bg); }
  .gk-tile .cell.gap.now { border-color: var(--blue); background: #EEF4FC; animation: nowpulse 1.6s ease-in-out infinite; }
  .gk-tile .cell.filled, .gk-tile .cell.just { border: 0; background: none; }
  .gk-tile .cell .qm { font-size: calc(var(--cell) * .5); }
  .cell.hl { box-shadow: 0 0 0 4px #A9C9EE; }
  .cell.nope { box-shadow: 0 0 0 4px #F2C48E; }
  .cell.right { box-shadow: 0 0 0 5px #9FDBB6; }
  .gk-num .cell { background: #FFFFFF; border: 2px solid #E6DCCB; border-radius: 22%; }
  .gk-num .nm { font: 700 calc(var(--cell) * .42)/1 var(--font); color: var(--ink); }
  .gk-num .cell.on { background: #6A97CC; border-color: #4F7BB0; }
  .gk-num .cell.on .nm { color: #FFFFFF; }
  .gk-num .cell.nope { background: #FFF0D9; }
  .gk-matrix .cell { background: #FFFFFF; border: 2px solid #E6DCCB; border-radius: 18%; }
  .gk-matrix .cell > .pc { width: 78%; height: 78%; }
  .gk-matrix .cell.q { border: 3px dashed var(--q); background: var(--q-bg); }
  .gk-matrix .cell .qm { font-size: calc(var(--cell) * .45); }
  .motif { position: absolute; left: calc(var(--g) * -.5); top: calc(var(--g) * -.5); width: calc(100% + var(--g)); height: calc(100% + var(--g)); pointer-events: none; overflow: visible; }
  .motif line { stroke: var(--blue); stroke-width: .07; stroke-dasharray: .2 .13; vector-effect: none; }
  .mcell { width: var(--cell); height: var(--cell); padding: 0; border-radius: 18%; background: #FFFFFF; border: 2px solid #E3DACB; }
  .mcell.open { background: #FBF8F2; border-style: dashed; cursor: pointer; }
  .mcell.on { background: var(--mc); border: 2px solid var(--md); }
  .mcell.ghost { background: color-mix(in srgb, var(--mc) 28%, #FFFFFF); }
  .mcell.nope { box-shadow: 0 0 0 3px #F2C48E; }
  .mline-v, .mline-h { position: absolute; pointer-events: none; border-radius: 3px; }
  .mline-v { top: -10px; bottom: -10px; width: 6px; margin-left: -3px; background: repeating-linear-gradient(#4FA9B8 0 10px, transparent 10px 16px); }
  .mline-h { left: -10px; right: -10px; height: 6px; margin-top: -3px; background: repeating-linear-gradient(90deg, #4FA9B8 0 10px, transparent 10px 16px); }
  .mside { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3cqw, 30px); height: 100%; }
  .mside.vertical { flex-direction: column; }
  .mside .pic.big, .pic-q { width: min(60cqh, 32cqw, 260px); height: min(60cqh, 32cqw, 260px); }
  .mside.vertical .pic.big, .mside.vertical .pic-q { width: min(38cqh, 50cqw, 220px); height: min(38cqh, 50cqw, 220px); }
  .mside.single .pic.big { width: min(78cqh, 60cqw, 320px); height: min(78cqh, 60cqw, 320px); }
  .pond { width: 10px; align-self: stretch; margin: 8% 0; border-radius: 6px; background: linear-gradient(#C3E8EE, #7CC6D2); }
  .mside.vertical .pond { width: auto; height: 10px; align-self: stretch; margin: 0 20%; background: linear-gradient(90deg, #C3E8EE, #7CC6D2); }
  .pic-q { display: flex; align-items: center; justify-content: center; border: 3px dashed var(--q); background: var(--q-bg); border-radius: 12px; box-sizing: border-box; }
  .pic .mline { stroke: #4FA9B8; stroke-width: .09; stroke-dasharray: .22 .12; }
  .pic .mnone { stroke: #C46B5E; stroke-width: .12; stroke-linecap: round; fill: none; }

  /* ---------- growing blocks ---------- */
  .figs { --u: min(clamp(34px, 4cqw, 64px), var(--uh), var(--uw)); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 3cqh, 22px); }
  @container (max-width: 600px) {
    .figs.has-build { --u: min(34px, var(--uhn), var(--uwn)); }
    .figs.has-build .fig-row { flex-wrap: wrap; row-gap: 8px; }
    .figs.has-build .fig.build { flex-basis: 100%; }
  }
  .fig-row { display: flex; align-items: flex-end; justify-content: center; gap: clamp(14px, 3cqw, 36px); }
  .fig { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 8px; border: 2px solid transparent; background: none; border-radius: 14px; color: inherit; }
  button.fig { cursor: pointer; background: rgba(255,255,255,.6); border-color: #EFE5D3; }
  .fig.picked { background: #EAF5EE; border-color: #BFE6CC; }
  .fig-label { font: 800 15px/1 var(--font); color: var(--soft); white-space: nowrap; }
  .fig-count { position: absolute; top: -6px; right: -6px; min-width: 26px; height: 26px; padding: 0 5px; box-sizing: border-box; border-radius: 13px; background: var(--ink); color: #FFFFFF; font: 800 14px/26px var(--font); text-align: center; }
  .fig-q { display: flex; align-items: center; justify-content: center; border: 3px dashed var(--q); background: var(--q-bg); border-radius: 10px; min-width: 44px; min-height: 44px; box-sizing: border-box; }
  .fig-q .qm { font-size: 30px; }
  .fig.more { flex-direction: row; align-items: center; }
  .order-n { position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--go); color: #FFFFFF; font: 800 14px/26px var(--font); text-align: center; }
  .blocks { display: block; overflow: visible; }
  .blk.nb rect { opacity: .5; }
  .bgrid { display: grid; gap: 2px; background: #F2ECE1; padding: 6px; border-radius: 10px; border: 2px dashed #D8CBB2; }
  .bcell { width: var(--u); height: var(--u); padding: 0; border: 1px solid #E3D8C6; background: #FFFDF8; border-radius: 4px; display: flex; }
  button.bcell { cursor: pointer; }
  .bcell.on { border-color: transparent; background: none; }
  .bcell.ghost { background: #F4DFC0; }
  .bcell .blocks.one { width: 100% !important; height: 100% !important; }
  .gtable { border-collapse: separate; border-spacing: 6px 4px; font: 800 clamp(16px, 2.8dvh, 28px)/1.2 var(--font); color: var(--ink); }
  .gtable th { text-align: left; color: var(--soft); padding-right: 6px; font-size: .85em; }
  .gtable td { min-width: clamp(44px, 3.6cqw, 62px); text-align: center; background: #FFFFFF; border: 2px solid #E6DCCB; border-radius: 10px; padding: 4px 8px; }
  .gtable td.q { border: 3px dashed var(--q); background: var(--q-bg); color: #C47F0E; }
  .gtable td.q.just { border-style: solid; border-color: #4CAF7A; background: #F2FAF5; color: var(--ink); }
  .gtable tr.diffs td { background: none; border: 0; color: #B07514; font-size: .72em; padding: 0; }
  .gtable td.far-gap { background: none; border: 0; }

  /* ---------- the pattern machine ---------- */
  .mach { --mn: clamp(48px, calc((100cqh - 70px) / 3.3), 88px); display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2.4cqw, 28px); height: 100%; }
  .mcol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .mhead { font: 800 15px/1 var(--font); color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }
  .mnum { width: var(--mn); height: calc(var(--mn) * .9); display: flex; align-items: center; justify-content: center; }
  .mnum .pc { width: 100%; height: 100%; }
  .mnum.q { border: 3px dashed var(--q); background: var(--q-bg); border-radius: 22px; box-sizing: border-box; }
  .mnum .qm { font-size: calc(var(--mn) * .42); }
  .mbox { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: clamp(140px, 24cqw, 230px); padding: 16px 16px 18px; border-radius: 26px; background: #EDEAF7; border: 3px solid #CBC2EA; box-shadow: 0 6px 0 #D7D0EE; }
  .mbox .gear { width: 52px; height: 52px; animation: spin 10s linear infinite; }
  .mrule { font: 800 clamp(20px, 4cqh, 30px)/1.2 var(--font); color: #3E3270; background: #FFFFFF; border-radius: 14px; padding: 5px 16px; border: 2px solid #CBC2EA; white-space: nowrap; }
  .mach.two .mrule { font-size: clamp(17px, 3.4cqh, 24px); }
  .mrule.q { border: 3px dashed var(--q); background: var(--q-bg); color: #C47F0E; }
  .marrow, .aarrow { position: relative; width: clamp(22px, 4cqw, 46px); height: 14px; flex: none; }
  .marrow::before, .aarrow::before { content: ''; position: absolute; left: 0; right: 10px; top: 5px; height: 4px; border-radius: 2px; background: #B7ABCB; }
  .marrow::after, .aarrow::after { content: ''; position: absolute; right: 0; top: 0; border-left: 12px solid #B7ABCB; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .anal { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 4cqw, 46px); height: 100%; flex-wrap: wrap; }
  .apair { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; background: rgba(255,255,255,.6); }
  .acard { width: clamp(68px, 30cqh, 128px); height: clamp(68px, 30cqh, 128px); display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 3px solid #E6DCCB; border-radius: 22px; box-sizing: border-box; }
  .acard .pc { width: 80%; height: 80%; }
  .acard.q { border: 3px dashed var(--q); background: var(--q-bg); }
  .asep { width: 4px; align-self: stretch; margin: 12% 0; border-radius: 2px; background: #E6DCCB; }

  /* ---------- message bar ---------- */
  .pbar { flex: none; display: flex; align-items: center; gap: 12px; margin: 12px 16px 12px; min-height: 76px; padding: 8px 12px; box-sizing: border-box;
    border-radius: 22px; background: var(--paper); box-shadow: 0 0 0 3px #E9DDC9, 0 5px 0 #E2D2B6; }
  .avatar { width: 58px; height: 58px; flex: none; border-radius: 50%; overflow: hidden; background: #F6E1BF; border: 3px solid #E9DDC9; box-sizing: border-box; display: flex; }
  .avatar svg { width: 100%; height: 100%; }
  .msg { flex: 1 1 0; min-width: 0; margin: 0; padding: 8px 14px; border-radius: 14px; font: 800 clamp(16px, 2.5dvh, 22px)/1.3 var(--font); color: var(--ink); }
  .msg[data-kind="good"] { background: #EAF5EE; }
  .msg[data-kind="try"] { background: #FFF4E2; }
  .msg[data-kind="hint"] { background: #EEF4FF; }
  .msg[data-kind="demo"] { background: #EAF0FA; }
  .go { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 58px; padding: 0 20px 0 26px; border: 0; border-radius: 18px; background: var(--go); color: #FFFFFF;
    box-shadow: 0 5px 0 var(--go-edge); font: 800 22px/1 var(--font); cursor: pointer; white-space: nowrap; }
  .go:hover { filter: brightness(1.06); }
  .go:active { translate: 0 3px; box-shadow: 0 2px 0 var(--go-edge); }

  /* ---------- map, cards, summary ---------- */
  #map { padding: 14px 18px 10px; background: #FBF6EC; }
  .map-head { flex: none; }
  .map-head h2 { font-size: clamp(22px, 3.6dvh, 30px); color: #3A2E1F; }
  .map-head p { font: 700 16px/1.3 var(--font); color: var(--soft); }
  .map-svg { flex: 1 1 0; min-height: 0; width: 100%; }
  .map-label { font: 700 19px var(--font); fill: #3A2E1F; }
  .map-sub { font: 800 16px var(--font); fill: var(--soft); }
  .map-tag { font: 800 18px var(--font); fill: #FFFFFF; }
  .map-svg .later { opacity: .5; filter: saturate(.35); }
  .map-pulse { animation: pulse 2.4s ease-in-out infinite; }
  #card, #summary { align-items: center; justify-content: center; text-align: center; padding: 20px; background: #FBF6EC; overflow: auto; }
  .card-in, .sum-in { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 660px; }
  .card-icon { width: clamp(100px, 22dvh, 170px); height: clamp(100px, 22dvh, 170px); }
  .card-kicker { font: 800 18px/1.2 var(--font); color: var(--soft); }
  .card-in h2 { font-size: clamp(30px, 5.6dvh, 46px); }
  .card-text { font: 700 clamp(18px, 2.9dvh, 24px)/1.35 var(--font); color: #3A4258; }
  .card-fact { font: 700 clamp(17px, 2.6dvh, 21px)/1.4 var(--font); color: #5A4300; background: #FFF6DA; border: 2px solid #F2D27A; border-radius: 16px; padding: 12px 18px; }
  .sum-star svg { width: clamp(80px, 17dvh, 120px); height: clamp(80px, 17dvh, 120px); }
  .sum-in h2 { font-size: clamp(32px, 6dvh, 46px); }
  .sum-sub { font: 700 20px/1.3 var(--font); color: #3A4258; }
  .sum-where { font: 800 18px/1.3 var(--font); color: var(--soft); }
  .meter.big { width: 260px; height: 14px; }
  .sum-btns { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }

  /* ---------- the owl in "Watch me" ---------- */
  #owl { position: absolute; left: 0; top: 0; width: 96px; height: 102px; z-index: 30; pointer-events: none; }
  #owl svg { width: 100%; height: 100%; overflow: visible; }
  #carry { position: absolute; left: 0; top: 0; width: 60px; height: 60px; z-index: 29; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); display: flex; align-items: center; justify-content: center; }
  #carry > svg, #carry .pc { width: 100%; height: 100%; }
  #carry .mini { --mini: 26px; }
  .wing-l { transform-box: fill-box; transform-origin: 85% 15%; animation: flapL .42s ease-in-out infinite alternate; }
  .wing-r { transform-box: fill-box; transform-origin: 15% 15%; animation: flapR .42s ease-in-out infinite alternate; }
  .owl-bob { animation: bob 1.4s ease-in-out infinite alternate; }

  /* ---------- grown-ups ---------- */
  dialog.grown { width: min(780px, 94vw); max-height: 90dvh; padding: 0; border: 0; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
  dialog.grown::backdrop { background: rgba(38, 50, 75, .35); }
  .g-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: #FFFFFF; border-bottom: 2px solid #EFE6D6; }
  .g-head h2 { font-size: 22px; }
  #grown-body { padding: 4px 20px 20px; font: 600 17px/1.45 var(--font); }
  #grown-body section { padding: 12px 0; border-bottom: 1px solid #F0E8DA; }
  #grown-body h3 { font-size: 19px; margin-bottom: 6px; }
  #grown-body p { margin: 4px 0; }
  .g-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .g-label { font-weight: 800; margin-top: 8px; }
  #g-jump { width: 100%; font: 700 16px var(--font); padding: 8px; border-radius: 10px; border: 2px solid var(--line); background: #FFFFFF; color: var(--ink); }
  .g-toggle { display: flex; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; }
  .g-toggle input { width: 22px; height: 22px; flex: none; }
  .g-themes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .g-theme { display: inline-flex; align-items: center; gap: 6px; padding: 4px 13px 4px 6px; border-radius: 999px; border: 2px solid var(--line); background: #FFFFFF; font: 700 15px var(--font); color: var(--ink); cursor: pointer; }
  .g-theme .pc { width: 30px; height: 30px; }
  .g-theme[aria-pressed="false"] { opacity: .4; }
  .g-table th, .g-table td { padding: 2px 12px 2px 0; text-align: left; }
  .g-recent { columns: 2; padding-left: 18px; margin: 4px 0; }
  .g-recent .ok { color: #D6A12A; font-weight: 900; }
  .g-how { padding-left: 20px; margin: 4px 0; }

  /* ---------- movement ---------- */
  @keyframes pop { 0% { scale: .7; } 60% { scale: 1.08; } 100% { scale: 1; } }
  @keyframes nudge { 0%, 100% { translate: 0; } 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
  @keyframes glow { 0% { scale: 1; filter: none; } 40% { scale: 1.09; filter: brightness(1.12) drop-shadow(0 0 7px #F4C452); } 100% { scale: 1; filter: none; } }
  @keyframes nowpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(47, 93, 168, .3); } 50% { box-shadow: 0 0 0 7px rgba(47, 93, 168, .1); } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes flapL { from { transform: rotate(0deg); } to { transform: rotate(-26deg); } }
  @keyframes flapR { from { transform: rotate(0deg); } to { transform: rotate(26deg); } }
  .just > .box, .cell.just > .pc, .fig.q .blocks, .acard.just, .mnum.just, .mrule.just, .pic.just, .bcell.on .blocks { animation: pop .45s ease-out; }
  .nudge { animation: nudge .4s ease-in-out; }
  .glow > .box, .cell.glow > .pc, .uarc.glow { animation: glow .55s ease-out; }
  body.calm .glow > .box, body.calm .cell.glow > .pc, body.calm .gear, body.calm .map-pulse, body.calm .owl-bob, body.calm .nowpulse { animation: none; }

  /* ---------- smaller screens ---------- */
  @media (max-width: 1100px) { .ptitle .sub .meter { display: none; } }
  @media (max-width: 900px), (max-height: 520px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .stage { flex: none; height: max(540px, 74dvh); }
    .ptop { flex-wrap: wrap; row-gap: 8px; }
    .dots { order: 20; width: 100%; justify-content: center; }
  }
  @media (max-width: 640px) {
    :root { --opt: 64px; --mini: 26px; }
    .pbtn .t { display: none; }
    .pbtn { padding: 0 12px; }
    .ptitle h1 { font-size: 21px; }
    .stage { margin: 8px 8px 0; border-radius: 20px; height: max(520px, 78dvh); }
    .pbar { flex-wrap: wrap; margin: 10px 8px; }
    .msg { flex-basis: 100%; order: -1; }
    .go { margin-left: auto; }
    .b-small { display: none; }
    .qrow { padding: 10px 14px 0; }
    .scene { padding: 4px 8px; }
  }
  /* A phone held upright: keep it all on one screen, no scrolling. */
  @media (max-width: 640px) and (min-height: 620px) {
    body { height: 100dvh; min-height: 0; overflow: hidden; }
    .stage { flex: 1 1 0; height: auto; min-height: 0; }
    .ptop { padding: 8px 10px; gap: 8px; row-gap: 6px; }
    .ptitle h1 { display: none; }
    .ptitle { margin-left: 0; }
    .chip.world { font-size: 0; gap: 0; padding: 0 3px; }
    .stars { padding: 0 10px 0 6px; }
    .pbar { margin: 8px; min-height: 0; padding: 6px 8px; gap: 8px; row-gap: 6px; }
    .msg { font-size: 16px; padding: 6px 10px; }
    .go { height: 50px; }
    .answers { gap: 10px; }
  }
</style>
</head>
<body data-screen="map">
<header class="ptop">
  <a class="pbtn" href="../index.html"><span class="ic" id="home-icon"></span><span class="t">Home</span></a>
  <a class="pbtn" href="./"><span class="ic" id="maths-icon"></span><span class="t">Maths</span></a>
  <div class="ptitle"><h1>Patterns</h1><div class="sub" id="sub"></div></div>
  <div class="spacer"></div>
  <ol class="dots" id="dots" hidden></ol>
  <div class="stars" id="stars"><span class="ic" id="star-icon"></span><span id="star-count">0</span></div>
  <button class="pbtn round" id="sound-btn" type="button" aria-label="Sounds on or off"></button>
  <button class="pbtn round" id="grown-btn" type="button" aria-label="Grown-ups: progress, level and settings"></button>
</header>
<main class="stage" id="stage">
  <section class="screen" id="map" aria-label="Journey map"></section>
  <section class="screen" id="play" hidden aria-label="Puzzle">
    <div class="banner" id="banner" hidden></div>
    <div class="qrow"><h2 class="q" id="q"></h2><span class="flavour" id="flavour" hidden></span></div>
    <div class="scene" id="scene"></div>
    <div class="answers" id="answers"></div>
    <div id="carry" hidden></div>
    <div id="owl" hidden></div>
  </section>
  <section class="screen" id="card" hidden aria-live="polite"></section>
  <section class="screen" id="summary" hidden aria-live="polite"></section>
</main>
<footer class="pbar" id="bar">
  <span class="avatar" id="avatar" hidden></span>
  <button class="pbtn round" id="say-btn" type="button" aria-label="Read this out loud"></button>
  <p class="msg" id="msg" aria-live="polite"><span id="msg-text"></span></p>
  <button class="tool" id="hint-btn" type="button" hidden></button>
  <button class="go" id="main-btn" type="button" hidden></button>
</footer>
<dialog class="grown" id="grownups" aria-label="Grown-ups">
  <div class="g-head"><h2>Grown-ups</h2><button class="pbtn round" id="grown-close" type="button" aria-label="Close"></button></div>
  <div id="grown-body"></div>
</dialog>
<script src="../kit/kit.js?v=6"></script>
<script src="patterns/art.js?v=1"></script>
<script src="patterns/worlds.js?v=3"></script>
<script src="patterns/scenes.js?v=1"></script>
<script src="patterns/game.js?v=3"></script>
</body>
</html>

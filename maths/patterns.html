    // ---- Stage 6: rule finder ----
    { st: 6, steps: [2, 3, 5, 10, 4], back: true,
      deck: ['rule', 'useRule', 'rule', 'num', 'useRule'],
      desc: 'What’s the rule? (+ 3 each time), and using a rule to make the numbers.' },
    { st: 6, steps: [6, 7, 9, 25, 1000], back: true, useN: 4,
      deck: ['rule', 'numMiss', 'useRule', 'numFix', 'num'],
      desc: '6s, 7s, 9s, 25s and 1000s.' },
    { st: 6, steps: [2, 3, 5, 10, 1, 4], zero: true,
      deck: ['num', 'rule', 'numMiss', 'useRule', 'numFix'],
      desc: 'Going below zero, like 4, 2, 0, −2.' },
    { st: 6, steps: ['half', '0.5', '0.2', '0.1'], back: true,
      deck: ['num', 'rule', 'numMiss', 'useRule', 'num'],
      desc: 'Halves and decimals, like 1, 1½, 2 and 0.2, 0.4, 0.6.' },
    // ---- Stage 7: pattern master ----
    { st: 7, units: ['AB', 'ABB', 'AAB', 'ABC'], near: true,
      deck: ['two', 'far', 'two', 'letters', 'two', 'far'],
      desc: 'Two things change at once (colour and shape); looking a few carriages ahead; making a pattern from letters.' },
    { st: 7, units: ['AB', 'ABC', 'AAB', 'ABB', 'AABB', 'ABCD'],
      deck: ['far', 'far', 'two', 'far', { t: 'own', ownP: 3 }, 'far'],
      desc: 'Looking far ahead: what will be in carriage 14?' },
    { st: 7, jumps: ['grow', 'double', 'tri', 'halve'], shapes: ['stairs', 'L'],
      deck: ['jump', 'shapeN', 'jump', { t: 'jump', mode: 'rule' }, 'jump', 'shapeN'],
      desc: 'Jumps that get bigger, doubling and halving, and counting the blocks in growing shapes.' },
    { st: 7, jumps: ['square', 'fib', 'double', 'grow', 'halve'], shapes: ['square', 'stairs'], units: ['ABC', 'AABB', 'ABCD', 'AABC'],
      deck: ['shapeN', 'jump', { t: 'jump', mode: 'rule' }, 'far', { t: 'own', ownP: 4 }, 'jump'],
      desc: 'Square numbers, adding the two numbers before, and his own pattern with a bit 4 long.' },
    { st: 7, top: true, win: 10, need: 8, ch: 4,
      units: ['ABC', 'AAB', 'ABB', 'AABB', 'ABCD', 'ABBC'], steps: [3, 4, 6, 7, 8, 9, 25, 'half', '0.2'], back: true, useN: 4,
      jumps: ['grow', 'double', 'square', 'halve', 'fib', 'tri'], shapes: ['stairs', 'square', 'L'],
      deck: ['far', 'two', 'jump', 'useRule', 'shapeN', 'make', 'numFix', { t: 'jump', mode: 'rule' }, 'letters', 'growbit', 'rule', 'same'],
      desc: 'Pattern expert: a mix of the hardest puzzles from every stage.' },
  ];
  const TOP = LADDER.length;

  // What grown-ups see: the name of each kind of puzzle, and the skill it belongs to (also shown in My Stars)
  const KIND_NAME = {
    copy: 'Copy the train', carry: 'Carry on the pattern', next: 'What comes next?', missing: 'What’s missing?',
    unit: 'Where it starts again', bit: 'Which bit repeats?', is: 'Pattern or not?', fix: 'Spot the wrong carriage',
    same: 'Same pattern, different things', make: 'Make the same pattern', letters: 'Make a pattern from letters', own: 'Make your own pattern',
    order: 'Size order', size: 'Size patterns', turn: 'Turning patterns', grow: 'Growing towers', shape: 'Growing shapes', growbit: 'A bit that gets longer',
    orderNum: 'Numbers in order', num: 'Next number', numMiss: 'Missing numbers', numFix: 'Spot the wrong number',
    rule: 'What’s the rule?', useRule: 'Use the rule', jump: 'Jumps that grow, doubling', shapeN: 'Counting growing shapes',
    two: 'Two things changing', far: 'Looking ahead',
  };
  const FAMILY = {
    copy: 'pat-copy', carry: 'pat-copy', next: 'pat-next', missing: 'pat-next',
    unit: 'pat-unit', bit: 'pat-unit', is: 'pat-unit', fix: 'pat-unit',
    same: 'pat-same', make: 'pat-same', letters: 'pat-same', own: 'pat-same',
    order: 'pat-size', size: 'pat-size', turn: 'pat-size', grow: 'pat-size', shape: 'pat-size', growbit: 'pat-size',
    orderNum: 'pat-number', num: 'pat-number', numMiss: 'pat-number', numFix: 'pat-number',
    rule: 'pat-rule', useRule: 'pat-rule', jump: 'pat-rule', shapeN: 'pat-rule',
    two: 'pat-hard', far: 'pat-hard',
  };
  const FAMILY_NAME = [
    ['pat-copy', 'Copying and carrying on'], ['pat-next', 'What comes next, what’s missing'],
    ['pat-unit', 'Finding the bit that repeats'], ['pat-same', 'Same pattern, different things'],
    ['pat-size', 'Size, turning and growing'], ['pat-number', 'Number patterns'],
    ['pat-rule', 'Finding and using the rule'], ['pat-hard', 'Harder patterns'],
  ];

  const kindOf = e => (typeof e === 'string' ? e : e.t);
  const kindsOf = L => uniq(L.deck.map(kindOf));
  const needOf = L => L.need || 6;
  const winOf = L => L.win || 8;
  // One step of a level's deck, with the level's rules filled in
  const entryFor = (lvl, e) => Object.assign({}, LADDER[lvl - 1], typeof e === 'string' ? { t: e } : e, { deckLen: LADDER[lvl - 1].deck.length, lvl });
  function makePuzzle(plan, demo) {
    const E = entryFor(plan.lvl, plan.e);
    const pz = GEN[E.t](E, { k: demo ? 0 : plan.k, helper: !!plan.helper && !demo, demo: !!demo });
    pz.type = E.t;
    return pz;
  }

  /* ============================================================
     Progress, kept with the rest of the hub's record
     ============================================================ */
  const blankProgress = () => ({
    level: 1,          // level he's on
    win: [],           // his last few puzzles at this level, done on his own (1 = right first time)
    got: {},           // kinds of puzzle he has got right on his own at this level
    at: 0,             // how far through this level's order of puzzles he is
    again: null,       // a kind of puzzle he has just missed and is having another go at
    sinceReview: 0,    // puzzles since the last old favourite
    sinceChallenge: 0, // puzzles since the last challenge
    rounds: 0, stars: 0, hinted: 0,
    skills: {},        // kind of puzzle -> [puzzles, right first time]
    seen: {},          // kinds of puzzle he has met
    recent: [],        // last 30 puzzles
    facts: 0,          // stages finished
    expert: false,     // finished the top level
  });
  let P = blankProgress();
  const savedProgress = Kit.setting(PROGRESS_KEY);
  if (savedProgress && typeof savedProgress === 'object') P = Object.assign(blankProgress(), savedProgress);
  P.level = clamp(Math.round(P.level) || 1, 1, TOP);
  if (!Array.isArray(P.win)) P.win = [];
  if (!Array.isArray(P.recent)) P.recent = [];
  ['got', 'skills', 'seen'].forEach(k => { if (!P[k] || typeof P[k] !== 'object') P[k] = {}; });
  P.again = null;                                  // every sitting starts fresh
  const saveProgress = () => Kit.setting(PROGRESS_KEY, P);
  // How often a kind of puzzle is right first time (0.5 until there's enough to go on)
  const rateOf = kind => { const s = P.skills[kind]; return s && s[0] >= 2 ? s[1] / s[0] : 0.5; };
  // Kinds of puzzle on this level he hasn't yet got right on his own
  const uncovered = () => kindsOf(LADDER[P.level - 1]).filter(k => !P.got[k]);

  /* ============================================================
     Deciding what the next puzzle should be, from how he's doing
     ============================================================ */
  function pickReview() {
    const pool = [], here = LADDER[P.level - 1].st;
    for (let n = Math.max(1, P.level - 10); n < P.level; n++) {
      LADDER[n - 1].deck.forEach(e => {
        const k = kindOf(e);
        // kinds he finds harder come up more often, and so do ones from the stage he's on
        if (P.seen[k]) pool.push({ lvl: n, e, w: 0.4 + 1.6 * (1 - rateOf(k)) + (LADDER[n - 1].st === here ? 0.3 : 0) });
      });
    }
    if (!pool.length) return null;
    const x = weightedPick(pool, pool.map(p => p.w));
    return { flavour: 'review', lvl: x.lvl, e: x.e, k: rand(1000) };
  }
  function pickChallenge() {
    const pool = LADDER[P.level].deck.filter(e => P.seen[kindOf(e)]);     // only kinds he has met before
    return pool.length ? { flavour: 'challenge', lvl: P.level + 1, e: pick(pool), k: rand(1000) } : null;
  }
  function makePlan() {
    const L = LADDER[P.level - 1];
    // 1. He missed one: another go at the same kind. If that's hard too, an easier helper version.
    if (P.again) {
      const a = P.again;
      return a.step === 'retry' ? { flavour: 'retry', lvl: a.lvl, e: a.e, k: rand(1000) }
        : { flavour: 'practice', lvl: a.lvl, e: a.e, k: rand(1000), helper: true, demoAgain: a.n === 2 };
    }
    // 2. Every fifth puzzle is an old favourite from an earlier level
    if (P.level > 1 && P.sinceReview >= 4) { const r = pickReview(); if (r) return r; }
    // 3. Now and then, when it's going well: one puzzle from the next level up
    if (P.level < TOP && P.sinceChallenge >= 4 && P.win.length >= 3 && P.win.slice(-3).every(Boolean) && Math.random() < 0.5) {
      const ch = pickChallenge(); if (ch) return ch;
    }
    // 4. The next step in this level's order. If one kind is all that's left to get right, that kind comes next.
    let idx = P.at % L.deck.length;
    const left = uncovered();
    if (left.length && left.length < kindsOf(L).length && sum(P.win) >= needOf(L) - 1) {
      const j = L.deck.findIndex(e => kindOf(e) === left[0]);
      if (j >= 0) idx = j;
    }
    const plan = { flavour: 'level', lvl: P.level, e: L.deck[idx], k: P.at };
    P.at++;
    return plan;
  }

  /* ============================================================
     Game state
     ============================================================ */
  const stage = $('#stage'), panel = $('#panel');
  const msgBox = $('#msg'), msgText = $('#msg-text');
  const mainBtn = $('#main-btn'), hintBtn = $('#hint-btn'), backBtn = $('#back-btn');
  const soundBtn = $('#sound-btn'), dlg = $('#grownups');
  const V = { id: 0, pz: null, plan: null, vis: new Set(), built: [] };
  let session = null;
  let pendingCard = null;      // a stage has just been finished: show its pattern fact before the next puzzle
  let msgSay = '';

  function setMsg(kind, text) {
    msgBox.dataset.kind = kind;
    msgText.textContent = text;
    msgSay = text;
  }
  const mainTrain = () => $('[data-train="main"] .train', panel);

  function startSession() {
    const now = new Date().toISOString();
    session = { id: now, startedAt: now, count: 0, stars: 0, items: [], results: [], startLevel: P.level };
    P.again = null;
    pendingCard = null;
    $('#summary').hidden = true;
    stage.hidden = false;
    $('#actionbar').hidden = false;
    nextPuzzle();
  }

  function nextPuzzle() {
    const plan = makePlan(), kind = kindOf(plan.e);
    // The first time a kind of puzzle comes up, the game does one itself first
    if (SET.watch && (!P.seen[kind] || plan.demoAgain)) showPuzzle(makePuzzle(plan, true), plan, { demo: true });
    else { const isNew = !P.seen[kind]; P.seen[kind] = 1; showPuzzle(makePuzzle(plan), plan, { isNew }); }
    saveProgress();
  }
  function startPlanned() {            // after "Watch me": his turn
    const plan = V.plan, kind = kindOf(plan.e), isNew = !P.seen[kind];
    P.seen[kind] = 1;
    saveProgress();
    showPuzzle(makePuzzle(plan), plan, { isNew });
  }

  function showPuzzle(pz, plan, o = {}) {
    Object.assign(V, {
      id: V.id + 1, pz, plan, card: null,
      demo: !!o.demo, locked: !!o.demo, isNew: !!o.isNew, free: !!o.free,
      watching: false, solved: false, revealing: false, answered: false, mark: -1,
      tries: 0, hints: 0, prefix: '',
      fillAt: 0, fillMiss: 0, slotMiss: 0, ghost: false,
      built: [], checks: 0,
      vis: new Set(),
    });
    // Helper practice starts with the first hint already showing
    if (plan.helper && !o.demo) { const h = (pz.hints || []).find(x => x.show && x.show !== 'ghost'); if (h) V.vis.add(h.show); }
    if (pz.hopsStart) V.vis.add('hops');
    drawPuzzle();
    setMsg('info', openingText());
    renderTop();
    updateButtons();
    if (autoRead()) speak(`${pz.prompt} ${pz.card || ''} ${msgSay}`);
  }

  function openingText() {
    const pz = V.pz, fl = V.plan.flavour;
    if (V.demo) return P.seen[pz.type] ? 'Let me show you this kind again. Press 👀 Watch me.' : 'A new kind of puzzle! Press 👀 Watch me and I’ll do the first one.';
    const lead = fl === 'challenge' ? 'Challenge – a bit harder! ' : fl === 'practice' ? 'Let’s practise this kind. ' : fl === 'retry' ? 'Here’s another one like that. ' : V.isNew ? 'Your turn! ' : '';
    return lead + pz.open;
  }

  /* ============================================================
     Drawing a puzzle: question at the top, train in the middle,
     answers underneath – the same every time
     ============================================================ */
  const layoutOf = pz => (pz.model ? 'lay-two' : pz.mech === 'option' && pz.style !== 'groups' ? 'lay-opts' : pz.tall ? 'lay-tall' : 'lay-one');

  // Carriages that are still empty (the jumps next to them stay hidden)
  function hiddenIdx() {
    const pz = V.pz;
    if (V.answered) return [];
    if (pz.mech === 'choice') return [pz.hide];
    if (pz.mech === 'fill') return pz.slots.slice(V.fillAt);
    return [];
  }

  function fillCells() {
    const pz = V.pz, len = pz.phase2 != null && V.fillAt < pz.phase2 ? pz.phase2 : pz.seq.length;
    const order = new Map(pz.slots.map((s, j) => [s, j]));
    return range(0, len - 1).map(i => {
      if (!order.has(i)) return { t: pz.seq[i] };
      const j = order.get(i);
      if (j < V.fillAt) return { t: pz.seq[i], cls: 'filled' + (j === V.fillAt - 1 ? ' just' : '') };
      if (j > V.fillAt) return { empty: true };
      const guide = V.ghost || (pz.ghostAll && (pz.phase2 == null || V.fillAt < pz.phase2));
      return guide ? { empty: true, now: true, ghost: pz.seq[i] } : { q: true };
    });
  }
  function buildCells() {
    const pz = V.pz, n = pz.n || (V.solved ? V.built.length : Math.min(pz.max, V.built.length + 1));
    return range(0, n - 1).map(i => (i < V.built.length
      ? { t: V.built[i], cls: V.solved ? 'filled' : (i === V.built.length - 1 ? 'just' : '') }
      : { empty: true, now: i === V.built.length }));
  }
  function mainCells() {
    const pz = V.pz;
    if (pz.mech === 'fill') return fillCells();
    if (pz.mech === 'build') return buildCells();
    if (pz.mech === 'tap') {
      if (V.answered && pz.fix) return pz.seq.map((t, i) => ({ t, cls: i === pz.fix.at ? 'filled just' : '' }));
      return pz.shown.map((t, i) => ({ t, cls: V.answered && i === V.mark ? 'outline' : '' }));
    }
    if (pz.mech === 'choice') {
      if (pz.cells) return V.answered ? pz.cellsAfter : pz.cells;
      return pz.seq.map((t, i) => (i !== pz.hide ? { t } : V.answered ? { t, cls: 'filled just' } : { q: true }));
    }
    return pz.seq.map(t => ({ t }));
  }
  function mainOpts() {
    const pz = V.pz, A = V.answered;
    const o = { id: 'main', tall: pz.tall, tn: pz.tn, tap: pz.mech === 'tap' && !A };
    o.groups = pz.groupsFn ? (V.solved ? pz.groupsFn(V.built) : null) : pz.groups;
    if (o.groups && V.vis.has('outline')) o.outline = o.groups[0];
    if (o.groups && V.vis.has('split')) o.split = true;
    o.labels = A && pz.labelsAfter ? pz.labelsAfter : pz.labels;
    o.showLbl = !!pz.lblOn || V.vis.has('labels') || V.vis.has('letters');
    if (pz.hops) {
      o.hops = A && pz.hopsAfter ? pz.hopsAfter : pz.hops;
      o.showHops = V.vis.has('hops');
      o.hopsOff = new Set();
      hiddenIdx().forEach(i => { o.hopsOff.add(i); o.hopsOff.add(i + 1); });
    }
    return o;
  }

  function sceneHTML() {
    const pz = V.pz;
    let html = '';
    if (pz.model) {
      html += '<p class="row-label">This train</p>' +
        trainHTML(pz.model.map(t => ({ t })), { id: 'model', groups: pz.modelGroups, labels: pz.modelLabels, showLbl: V.vis.has('letters') }) +
        '<p class="row-label">Your train</p>';
    }
    const trains = pz.mech === 'option' && pz.style !== 'groups';
    if (trains) html += '<p class="row-label">This train</p>';
    html += trainHTML(mainCells(), mainOpts());
    if (trains) {
      html += `<div class="opts">${pz.opts.map((opt, k) =>
        `<button type="button" class="opt" data-act="opt" data-k="${k}" aria-label="Train ${k + 1}: ${esc(names(opt.seq))}">${
          trainHTML(opt.seq.map(t => ({ t })), { id: 'opt' + k, groups: chunks(opt.seq.length, opt.u.length), noSplit: true, labels: i => opt.u[i % opt.u.length] })}</button>`).join('')}</div>`;
    }
    return html;
  }
  function answersHTML() {
    const pz = V.pz;
    const piece = (t, act, i) => `<button type="button" class="choice" data-act="${act}" data-i="${i}" aria-label="${esc(t.name)}">${tokenHTML(t)}</button>`;
    if (pz.mech === 'choice') return pz.choices.map((t, i) => piece(t, 'pick', i)).join('');
    if (pz.mech === 'text') return pz.options.map((opt, i) => `<button type="button" class="choice txt" data-act="text" data-i="${i}">${esc(opt.label)}</button>`).join('');
    if (pz.mech === 'fill') return pz.palette.map((t, i) => piece(t, 'pal', i)).join('');
    if (pz.mech === 'build') return pz.palette.map((t, i) => piece(t, 'add', i)).join('') + '<button type="button" class="mini-btn" data-act="undo" disabled>↩ Take one off</button>';
    if (pz.mech === 'option' && pz.style === 'groups') {
      return pz.opts.map((opt, k) => `<button type="button" class="choice grp" data-act="opt" data-k="${k}" aria-label="${esc(names(opt.toks))}">${
        opt.toks.map(t => `<span class="grp-tok">${tokenHTML(t)}</span>`).join('')}</button>`).join('');
    }
    return '';
  }
  function drawPuzzle() {
    const pz = V.pz, lock = V.locked ? ' locked' : '';
    panel.className = 'panel ' + layoutOf(pz);
    panel.innerHTML =
      `<div class="q-row"><h2 class="q" id="q">${esc(pz.prompt)}</h2>${pz.card ? `<p class="rule-card">${esc(pz.card)}</p>` : ''}</div>` +
      `<div class="scene${lock}" id="scene">${sceneHTML()}</div>` +
      `<div class="answers${pz.tall ? ' towers' : ''}${lock}" id="answers"${pz.tn ? ` style="--tn:${pz.tn}"` : ''}>${answersHTML()}</div>`;
    if (motion()) $$('#scene > .train-wrap > .train', panel).forEach(t => t.classList.add('roll'));
    panel.scrollTop = 0;
  }
  function refreshMain() {
    const w = $('[data-train="main"]', panel);
    if (w) w.outerHTML = trainHTML(mainCells(), mainOpts());
  }

  /* ============================================================
     Top bar and buttons
     ============================================================ */
  function meterHTML() {
    const L = LADDER[P.level - 1], need = needOf(L);
    if (L.top && P.expert) return '<span class="top">🏅 Top level!</span>';
    // One kind of puzzle still to get right? Then the last star waits for it.
    const v = clamp(Math.min(sum(P.win), need - (uncovered().length ? 1 : 0)), 0, need);
    return `<span class="meter-bar" aria-hidden="true"><span class="meter-fill" style="width:${Math.round((100 * v) / need)}%"></span></span><span class="meter-num">⭐ ${v}/${need}</span>`;
  }
  function meterTitle() {
    const L = LADDER[P.level - 1];
    if (L.top && P.expert) return 'Top level';
    return `Get ${needOf(L)} of your last ${winOf(L)} puzzles right first time, on your own, to ${L.top ? 'become a Pattern Expert' : 'reach level ' + (P.level + 1)}`;
  }
  function dotsHTML(current) {
    return range(0, SITTING - 1).map(i => {
      if (i < session.results.length) return session.results[i] ? '<li class="star" aria-label="Star">⭐</li>' : '<li class="done" aria-label="Done">✓</li>';
      return `<li${i === session.results.length && current ? ' class="now" aria-current="step"' : ''}>${i + 1}</li>`;
    }).join('');
  }
  function renderTop() {
    $('#level-badge').textContent = `Level ${P.level}`;
    const meter = $('#meter');
    meter.innerHTML = meterHTML();
    meter.title = meterTitle();
    const playing = $('#summary').hidden && !V.free && !V.card;
    const current = playing && session.count < SITTING && (!V.solved || V.demo);
    $('#round-label').textContent = `Puzzle ${Math.min(session.count + (current ? 1 : 0), SITTING)} of ${SITTING}`;
    const fl = $('#flavour'), kind = V.plan && V.plan.flavour;
    const chip = !$('#summary').hidden || V.card ? null
      : V.free ? ['new', '🎨 Just for fun']
      : V.demo ? ['watch', '👀 Watch me']
      : kind === 'challenge' ? ['challenge', '🚀 Challenge']
      : kind === 'practice' ? ['practice', '🛟 Practice']
      : kind === 'review' ? ['review', '🔁 Old favourite']
      : V.isNew ? ['new', '✨ New'] : null;
    fl.hidden = !chip;
    if (chip) { fl.className = 'flavour ' + chip[0]; fl.textContent = chip[1]; }
    $('#dots').innerHTML = dotsHTML(current);
  }

  const buildReady = () => V.built.length >= (V.pz.n || V.pz.min);
  function updateButtons() {
    const pz = V.pz;
    let label = '', on = true;
    if (V.card) label = 'Keep going ▶';
    else if (V.locked) label = '👀 Watch me';
    else if (V.watching || V.revealing) label = '';
    else if (V.solved) label = V.demo ? 'Your turn ▶' : V.free ? 'Make another ▶' : session.count >= SITTING ? 'See today’s stars' : 'Next ▶';
    else if (pz.mech === 'build') { label = '✓ Check my train'; on = buildReady(); }
    mainBtn.textContent = label || 'Next ▶';
    mainBtn.style.visibility = label ? 'visible' : 'hidden';
    mainBtn.disabled = !on;
    const canHint = !V.card && !V.locked && !V.watching && !V.solved && pz.hints && pz.hints.length;
    hintBtn.style.visibility = canHint ? 'visible' : 'hidden';
    backBtn.hidden = !V.free;
    const undo = $('[data-act="undo"]', panel);
    if (undo) undo.disabled = !V.built.length || V.solved;
  }

  /* ============================================================
     Answering
     ============================================================ */
  // Multiple choice: pieces, words, or whole trains
  function missed(btn) {
    V.tries++;
    playSound('soft');
    btn.classList.add('gone');
    btn.disabled = true;
    const left = $$('[data-act="pick"]:not(.gone), [data-act="text"]:not(.gone), [data-act="opt"]:not(.gone)', panel).length;
    if (V.tries >= 2 || left <= 1) return giveAnswer();
    setMsg('fix', V.pz.wrong);
    if (autoRead()) speak(V.pz.wrong);
  }
  function pickChoice(btn) {
    const pz = V.pz;
    if (pz.choices[+btn.dataset.i].key !== pz.answer.key) return missed(btn);
    btn.classList.add('right');
    V.answered = true;
    refreshMain();
    finish(V.tries === 0);
  }
  function pickText(btn) {
    if (!V.pz.options[+btn.dataset.i].right) return missed(btn);
    btn.classList.add('right');
    finish(V.tries === 0);
  }
  function pickOption(btn) {
    if (!V.pz.opts[+btn.dataset.k].right) return missed(btn);
    btn.classList.add('right');
    finish(V.tries === 0);
  }

  // Tapping a carriage: where it starts again, or the one that is wrong
  function tapCar(car) {
    const pz = V.pz, i = +car.dataset.i;
    if (pz.okAt(i)) {
      V.mark = i; V.answered = true;
      refreshMain();
      return finish(V.tries === 0);
    }
    V.tries++;
    playSound('soft');
    car.classList.add('nope');
    setTimeout(() => car.classList.remove('nope'), 700);
    if (V.tries >= 2) return giveAnswer();
    const text = pz.wrongAt(i);
    setMsg('fix', text);
    if (autoRead()) speak(text);
  }

  // Filling carriages in order: copying, carrying on, size order, missing numbers
  function tapPalette(btn) {
    const pz = V.pz, want = pz.seq[pz.slots[V.fillAt]];
    if (pz.palette[+btn.dataset.i].key === want.key) {
      playSound('tick');
      if (pz.single) { btn.classList.add('used'); btn.disabled = true; }
      V.fillAt++; V.slotMiss = 0; V.ghost = false;
      if (V.fillAt === pz.slots.length) { refreshMain(); return finish(V.fillMiss === 0); }
      if (pz.phase2 != null && V.fillAt === pz.phase2) {
        $('#q').textContent = pz.prompt2;
        setMsg('ok', 'Same as the top train! Now carry it on. What comes next?');
      } else setMsg('info', pz.keepGoing ? pz.keepGoing(V.fillAt) : 'Yes! Keep going.');
      refreshMain();
      return;
    }
    V.fillMiss++; V.slotMiss++; V.tries++;
    playSound('soft');
    btn.classList.add('nudge');
    setTimeout(() => btn.classList.remove('nudge'), 450);
    if (V.slotMiss >= 2) { V.ghost = true; refreshMain(); }      // two misses on one carriage: a faint guide appears
    const text = (pz.phase2 != null && V.fillAt >= pz.phase2 && pz.wrong2) || pz.wrong;
    setMsg('fix', text);
    if (autoRead()) speak(text);
  }

  // Building his own train, then pressing Check
  function addPiece(btn) {
    const pz = V.pz;
    if (V.built.length >= (pz.n || pz.max)) { setMsg('fix', 'Your train is full. Press Check, or take one off.'); return; }
    V.built.push(pz.palette[+btn.dataset.i]);
    playSound('tick');
    refreshMain();
    updateButtons();
    if (V.built.length >= (pz.n || pz.max)) setMsg('info', 'Your train is full. Press Check when you are ready.');
    else if (!pz.n && buildReady()) setMsg('info', `${plural(V.built.length, 'carriage', 'carriages')}. Add more, or press Check.`);
  }
  function undoPiece() {
    if (!V.built.length) return;
    V.built.pop();
    playSound('undo');
    refreshMain();
    updateButtons();
  }
  function checkBuild() {
    const pz = V.pz, res = pz.check(V.built);
    V.checks++;
    if (res.ok) return finish(V.checks === 1, pz.explainBuilt(V.built));
    V.tries++;
    playSound('soft');
    if (V.tries >= 3) {                              // three goes: show one way to do it
      V.built = pz.solution();
      V.prefix = 'Here is one way to do it. ';
      return finish(false, pz.explainBuilt(V.built));
    }
    if (res.cut != null) V.built.length = res.cut;
    refreshMain();
    updateButtons();
    setMsg('fix', res.msg);
    if (autoRead()) speak(res.msg);
  }

  // Shows the right answer (after two misses, or for "Watch me")
  function showRight() {
    const pz = V.pz, mark = sel => { const b = $(sel, panel); if (b) { b.classList.remove('gone'); b.classList.add('right'); } };
    if (pz.mech === 'choice') mark(`[data-act="pick"][data-i="${pz.choices.findIndex(t => t.key === pz.answer.key)}"]`);
    else if (pz.mech === 'text') mark(`[data-act="text"][data-i="${pz.options.findIndex(x => x.right)}"]`);
    else if (pz.mech === 'option') mark(`[data-act="opt"][data-k="${pz.opts.findIndex(x => x.right)}"]`);
    else if (pz.mech === 'tap') V.mark = pz.markAt;
    V.answered = true;
    refreshMain();
  }
  function giveAnswer() {
    showRight();
    V.prefix = 'Here it is. ';
    finish(false);
  }

  /* ============================================================
     After an answer: the reason why, and the train lights up
     ============================================================ */
  async function finish(star, text) {
    if (V.solved) return;
    const id = V.id, pz = V.pz;
    V.solved = true; V.revealing = true; V.answered = true;
    $$('#answers button, .opt', panel).forEach(b => { b.disabled = true; });
    if ((pz.mech === 'fill' && pz.single) || pz.mech === 'build') $('#answers').classList.add('done');
    const res = V.demo || V.free ? null : recordPuzzle(star);
    let msg = (V.demo ? 'See? ' : V.free ? '' : star ? '⭐ Yes, that’s right! ' : (V.prefix || 'That’s it. ')) + (text || pz.explain);
    if (V.demo) msg += ' Now you try one.';
    if (res && res.expert) msg += ' 🏅 You have finished the top level. You are a Pattern Expert!';
    else if (res && res.levelUp) msg += ` 🎉 Level up! You’re on level ${P.level} now.`;
    setMsg(star || V.demo || V.free ? 'ok' : 'info', msg);
    if (res && (res.levelUp || res.expert)) playSound('levelup');
    else if (star || V.free) playSound('right');
    renderTop();
    updateButtons();
    if (res && res.levelUp) { const b = $('#level-badge'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    else if (res && star) { const m = $('#meter'); m.classList.add('pop'); setTimeout(() => m.classList.remove('pop'), 800); }
    if (autoRead()) speak(msg);
    await reveal();
    if (id !== V.id) return;
    V.revealing = false;
    updateButtons();
    if (!dlg.open) mainBtn.focus({ preventScroll: true });
  }

  async function reveal() {
    const pz = V.pz, what = pz.reveal;
    if (what === 'hops') { V.vis.add('hops'); refreshMain(); return; }
    if (what === 'labels') { V.vis.add('labels'); refreshMain(); return; }
    if (what === 'same') {
      V.vis.add('labels');
      refreshMain();
      const k = pz.opts.findIndex(x => x.right), other = $(`[data-train="opt${k}"] .train`, panel);
      $$('.opt .train', panel).forEach(t => t.classList.add('show-lbl'));
      await Promise.all([lightUnits(mainTrain(), pz.groups), lightUnits(other, chunks(pz.opts[k].seq.length, pz.opts[k].u.length), false)]);
      return;
    }
    if (what !== 'units') return;
    if (pz.mech === 'build') {                       // the train he built now shows its bits (and its letters)
      if (pz.labels) V.vis.add('letters');
      refreshMain();
      const m = $('[data-train="model"] .train', panel);
      if (m) { m.classList.add('show-lbl'); lightUnits(m, pz.modelGroups); }
      await lightUnits(mainTrain(), pz.groupsFn ? pz.groupsFn(V.built) : pz.groups);
      return;
    }
    await lightUnits(mainTrain(), pz.groups);
  }

  /* ============================================================
     Hints – they point to where to look. A puzzle done with a hint
     still wins its star, but doesn't count towards moving up.
     ============================================================ */
  function applyShow(what) {
    V.vis.add(what);
    if (what === 'ghost') V.ghost = true;
    refreshMain();
    if (what === 'letters') { const m = $('[data-train="model"] .train', panel); if (m) m.classList.add('show-lbl'); }
  }
  function showHint() {
    const pz = V.pz;
    if (V.card || V.locked || V.watching || V.solved || !pz.hints || !pz.hints.length) return;
    const h = pz.hints[Math.min(V.hints, pz.hints.length - 1)];
    V.hints++;
    playSound('tick');
    if (h.show) applyShow(h.show);
    setMsg('hint', h.text);
    if (autoRead()) speak(h.text);
  }

  /* ============================================================
     "Watch me": the first time a kind of puzzle comes up, the
     game does one itself, slowly. Then it's his turn.
     ============================================================ */
  async function watchMe() {
    if (!V.locked || V.watching) return;
    const id = V.id, pz = V.pz, step = motion() ? 520 : 0;
    V.locked = false; V.watching = true;
    updateButtons();
    setMsg('hint', 'Watch me…');
    await wait(motion() ? 650 : 0);
    if (id !== V.id) return;
    if (pz.mech === 'fill') {
      while (V.fillAt < pz.slots.length) {
        const want = pz.seq[pz.slots[V.fillAt]];
        if (pz.single) { const b = $(`[data-act="pal"][data-i="${pz.palette.findIndex(t => t.key === want.key)}"]`, panel); if (b) b.classList.add('used'); }
        V.fillAt++;
        playSound('tick');
        if (pz.phase2 != null && V.fillAt === pz.phase2) $('#q').textContent = pz.prompt2;
        refreshMain();
        await wait(step);
        if (id !== V.id) return;
      }
    } else if (pz.mech === 'build') {
      for (const t of pz.solution()) {
        V.built.push(t);
        playSound('tick');
        refreshMain();
        await wait(step);
        if (id !== V.id) return;
      }
    } else showRight();
    V.watching = false;
    $$('.locked', panel).forEach(el => el.classList.remove('locked'));
    finish(false, pz.mech === 'build' ? pz.explainBuilt(V.built) : undefined);
  }

  /* ============================================================
     After each puzzle: stars, levels, saving to My Stars
     ============================================================ */
  function recordPuzzle(star) {
    const plan = V.plan, kind = V.pz.type, fl = plan.flavour;
    const helped = V.hints > 0 || fl === 'practice';         // only puzzles done on his own count towards moving up
    const L = LADDER[P.level - 1];
    P.rounds++;
    if (star) P.stars++;
    if (V.hints) P.hinted++;
    countUp(P.skills, kind, star);
    P.recent.push({ l: plan.lvl, s: star ? 1 : 0, t: kind, f: fl.charAt(0), h: V.hints ? 1 : 0 });
    if (P.recent.length > 30) P.recent.shift();
    if (fl === 'review') P.sinceReview = 0; else P.sinceReview++;
    if (fl === 'challenge') P.sinceChallenge = 0; else P.sinceChallenge++;

    if (fl === 'level' || fl === 'retry') {
      if (!star) {
        // A miss: next comes another one like it. If that is missed too, helper practice.
        P.win.push(0);
        P.again = fl === 'level' ? { step: 'retry', lvl: plan.lvl, e: plan.e } : { step: 'practice', lvl: plan.lvl, e: plan.e, n: 0 };
      } else {
        P.again = null;
        if (!helped) { P.win.push(1); P.got[kind] = (P.got[kind] || 0) + 1; }
      }
    } else if (fl === 'practice') {
      if (star) P.again = null;                               // practice ends on a win
      else if (P.again) { P.again.n = (P.again.n || 0) + 1; if (P.again.n >= 3) P.again = null; }
    } else if (fl === 'challenge' && star && !helped) {
      P.win.push(1, 1);                                       // a challenge counts double
    }
    if (P.win.length > winOf(L)) P.win = P.win.slice(-winOf(L));

    let levelUp = false, expert = false;
    if (sum(P.win) >= needOf(L) && !uncovered().length) {
      if (L.top) { if (!P.expert) { P.expert = true; expert = true; } }
      else {
        P.level++; P.win = []; P.got = {}; P.at = 0; P.again = null;
        levelUp = true;
        const now = LADDER[P.level - 1].st;
        if (now !== L.st) { P.facts = Math.max(P.facts || 0, L.st); pendingCard = { done: L.st, next: now }; }
      }
    }
    saveProgress();

    // This sitting, saved to the hub after every puzzle
    session.count++;
    if (star) session.stars++;
    session.results.push(star ? 1 : 0);
    session.items.push({ type: FAMILY[kind], firstTry: !!star });
    Kit.saveResult({
      activity: ACTIVITY, section: SECTION, title: TITLE, kind: 'maths-game', adds: true,
      session: session.id, startedAt: session.startedAt,
      score: session.stars, total: session.count, rounds: session.count, level: P.level,
      items: session.items,
    });
    return { levelUp, expert };
  }

  async function advance() {
    if (pendingCard) return showCard();
    if (session.count >= SITTING) return showSummary();
    if (motion()) {
      const id = V.id;
      mainBtn.style.visibility = 'hidden';
      $$('#scene > .train-wrap > .train', panel).forEach(t => { t.classList.remove('roll'); t.classList.add('leave'); });
      await wait(360);
      if (id !== V.id) return;
    }
    nextPuzzle();
  }

  // The end of a stage: its pattern fact, before the next puzzle
  function showCard() {
    const done = STAGES[pendingCard.done - 1], next = STAGES[pendingCard.next - 1];
    pendingCard = null;
    V.id++; V.card = true; V.solved = true; V.demo = false;
    panel.className = 'panel';
    panel.innerHTML = `<div class="fact-card">
      <div class="fact-emoji" aria-hidden="true">${done.emoji}</div>
      <h2>Stage ${done.n} finished: ${esc(done.name)}!</h2>
      <p class="fact-label">Pattern fact</p>
      <p class="fact-text">${esc(done.fact)}</p>
      <p class="fact-next">Next: ${next.emoji} ${esc(next.name)}</p>
    </div>`;
    const text = `You finished stage ${done.n}! Pattern fact: ${done.fact}`;
    setMsg('ok', text);
    playSound('levelup');
    renderTop();
    updateButtons();
    if (autoRead()) speak(text);
    mainBtn.focus({ preventScroll: true });
  }

  /* ============================================================
     End of a sitting
     ============================================================ */
  function showSummary(quiet) {
    V.id++; V.free = false; V.card = null;
    stage.hidden = true;
    $('#actionbar').hidden = true;
    $('#summary').hidden = false;
    if (!quiet) playSound('right');
    renderSummary();
    renderTop();
    $('#again-btn').focus();
    if (!quiet && autoRead()) speak(`Great work today! ${plural(session.stars, 'star', 'stars')}.`);
  }
  function renderSummary() {
    const L = LADDER[P.level - 1], st = STAGES[L.st - 1], up = P.level - session.startLevel;
    const expert = L.top && P.expert;
    $('#summary-trophy').textContent = expert ? '🏅' : '🏆';
    $('#summary-title').textContent = expert ? 'Pattern Expert!' : 'Great work today!';
    $('#summary-stars').textContent = `⭐ ${session.stars}`;
    $('#summary-stars-word').textContent = session.stars === 1 ? 'star today' : 'stars today';
    $('#summary-dots').innerHTML = dotsHTML(false);
    $('#summary-badge').textContent = `Level ${P.level}`;
    $('#summary-meter').innerHTML = meterHTML();
    let text = up > 0 ? `You moved up ${up === 1 ? 'a level' : up + ' levels'}! ` : '';
    if (expert) text += 'You have finished every level. ';
    text += 'Your stars are in My Stars.';
    $('#summary-text').textContent = text;
    $('#summary-fact').innerHTML = `<b>${st.emoji} Pattern fact</b>${esc(st.fact)}`;
  }

  // Just for fun after a sitting: make any train he likes (no stars)
  function startFree() {
    $('#summary').hidden = true;
    stage.hidden = false;
    $('#actionbar').hidden = false;
    const pz = GEN.own({}, { k: 0, helper: false });
    pz.type = 'own';
    showPuzzle(pz, { flavour: 'free', lvl: P.level, e: 'own' }, { free: true });
  }

  /* ============================================================
     Grown-ups panel: progress by skill, level and settings
     ============================================================ */
  let levelChanged = false, resetArmed = false, resetTimer = 0;

  function renderGrownups() {
    const L = LADDER[P.level - 1], st = STAGES[L.st - 1], need = needOf(L), W = winOf(L);
    const pct = s => (s && s[0] ? Math.round((100 * s[1]) / s[0]) : null);
    const fam = {};
    Object.keys(P.skills).forEach(k => { const f = FAMILY[k]; if (!f) return; const s = fam[f] || (fam[f] = [0, 0]); s[0] += P.skills[k][0]; s[1] += P.skills[k][1]; });
    const famRows = FAMILY_NAME.map(([f, label]) => {
      const s = fam[f], p = pct(s);
      return `<div class="stat-row"><span class="stat-label">${label}</span><span class="track-bar" aria-hidden="true"><span class="fill" style="width:${p || 0}%"></span></span><span class="stat-num">${p == null ? 'Not yet' : p + '%'}<small>${s ? plural(s[0], 'puzzle', 'puzzles') : ''}</small></span></div>`;
    }).join('');
    const kindRows = Object.keys(KIND_NAME).filter(k => P.skills[k])
      .map(k => `<li><span>${KIND_NAME[k]}</span><b>${P.skills[k][1]} of ${P.skills[k][0]} right first time</b></li>`).join('') || '<li>No puzzles yet.</li>';
    const FL = { r: ', another go', p: ', helper practice', o: ', old favourite', c: ', challenge' };
    const recent = P.recent.length
      ? P.recent.map(r => `<li class="${r.s ? 'all' : ''}${r.f === 'c' ? ' ch' : ''}" title="Level ${r.l}: ${esc(KIND_NAME[r.t] || r.t)}, ${r.s ? 'right first time' : 'needed another go'}${FL[r.f] || ''}${r.h ? ', used a hint' : ''}">${r.s ? '⭐' : '✓'}</li>`).join('')
      : '<li class="none">No puzzles yet.</li>';
    const left = uncovered().map(k => KIND_NAME[k]);
    const done = sum(P.win);
    let how;
    if (L.top && P.expert) how = 'Top level finished: he is a Pattern Expert. Puzzles keep coming from every stage.';
    else {
      how = `On his own, he has got ${done} of his last ${P.win.length} puzzles at this level right first time. He ${L.top ? 'finishes' : 'moves up'} at ${need} of his last ${W}.`;
      if (left.length && P.win.length) how += ` Still to get right on this level: ${listNames(left)}.`;
    }
    const notes = [];
    if (P.win.length >= 6 && done * 2 <= P.win.length) notes.push('He is finding this level hard at the moment. The game gives easier helper practice in between. You can also move him down a level.');
    const lastHints = P.recent.slice(-20).filter(r => r.h).length;
    if (lastHints >= 8) notes.push(`He used a hint on ${lastHints} of his last ${Math.min(20, P.recent.length)} puzzles. Those still win stars, but only puzzles done without a hint count towards moving up.`);
    const jump = STAGES.map(s => `<optgroup label="Stage ${s.n}: ${esc(s.name)}">${LADDER.map((l, i) => (l.st === s.n ? `<option value="${i + 1}"${i + 1 === P.level ? ' selected' : ''}>Level ${i + 1}</option>` : '')).join('')}</optgroup>`).join('');
    const levels = STAGES.map(s => `<p class="g-stage">${s.emoji} Stage ${s.n}: ${esc(s.name)} <small>(roughly ${esc(s.school)})</small></p><ol class="g-levels">${
      LADDER.map((l, i) => (l.st === s.n ? `<li${i + 1 === P.level ? ' class="here"' : ''}>Level ${i + 1}: ${esc(l.desc)}</li>` : '')).join('')}</ol>`).join('');
    const facts = STAGES.filter(s => s.n <= (P.facts || 0)).map(s => `<li><span>${s.emoji} ${esc(s.fact)}</span></li>`).join('') || '<li>None yet. He gets one each time he finishes a stage.</li>';
    const themes = Object.keys(THEMES).filter(t => t !== 'flags' || FLAGS_OK)
      .map(t => `<button type="button" class="g-pill" data-theme="${t}" aria-pressed="${themeOn(t)}">${THEMES[t]}</button>`).join('');
    $('#grown-body').innerHTML = `
      <section class="g-sec">
        <div class="g-level"><span class="g-num">Level ${P.level}</span><span class="g-of">of ${TOP} · ${st.emoji} ${esc(st.name)}</span></div>
        <p class="g-desc">${esc(L.desc)}</p>
        <p class="g-desc">${esc(how)}</p>
        ${notes.map(n => `<p class="g-note">${esc(n)}</p>`).join('')}
        <div class="g-btns">
          <button type="button" class="btn-secondary" data-g="down"${P.level <= 1 ? ' disabled' : ''}>− Easier level</button>
          <button type="button" class="btn-secondary" data-g="up"${P.level >= TOP ? ' disabled' : ''}>Harder level +</button>
          <select class="g-jump" id="g-jump" aria-label="Jump to a level">${jump}</select>
        </div>
      </section>
      <section class="g-sec">
        <h3>Settings</h3>
        <label class="g-check"><input type="checkbox" data-set="watch"${SET.watch ? ' checked' : ''}>
          <span>“Watch me” first: the game does one puzzle itself whenever a new kind comes up.</span></label>
        <label class="g-check"><input type="checkbox" data-set="helpers"${helpers ? ' checked' : ''}>
          <span>Show helper numbers: the jumps (+2) between numbers on the first number levels. Shared with Tallies and Bar Charts.</span></label>
        <label class="g-check"><input type="checkbox" data-set="read"${autoRead() ? ' checked' : ''}>
          <span>Read each question out loud by itself. The 🔈 button always works. Shared with Story Time.</span></label>
        <label class="g-check"><input type="checkbox" data-set="calm"${SET.calm ? ' checked' : ''}>
          <span>Calm mode: the train doesn’t roll in and nothing pops.</span></label>
        <p class="g-small" style="margin-bottom:8px">Pieces he likes. Patterns use only these (two or more must stay on):</p>
        <div class="g-pills">${themes}</div>
      </section>
      <section class="g-sec">
        <h3>Right first time</h3>
        ${famRows}
        <p class="g-small">${plural(P.rounds, 'puzzle', 'puzzles')} played, ${plural(P.stars, 'star', 'stars')} won, a hint used on ${plural(P.hinted || 0, 'puzzle', 'puzzles')}.</p>
        <details class="g-details" style="margin-top:8px"><summary>Every kind of puzzle</summary><ul class="g-list">${kindRows}</ul></details>
      </section>
      <section class="g-sec">
        <h3>Recent puzzles</h3>
        <ol class="g-recent">${recent}</ol>
        <p class="g-small">⭐ right first time, ✓ needed another go. An orange ring means a challenge. Hover over one to see what it was.</p>
      </section>
      <section class="g-sec">
        <h3>Pattern facts he has unlocked</h3>
        <ul class="g-list">${facts}</ul>
      </section>
      <section class="g-sec">
        <h3>How the stars and levels work</h3>
        <ul class="g-how">
          <li>Every level is designed: the same kinds of puzzle, in the same order, a small step harder than the level before. The pieces and numbers are made up fresh each time, so he can’t just remember answers and he never runs out.</li>
          <li>Each puzzle right first time wins a star. A sitting is ${SITTING} puzzles, so up to ${SITTING} stars, about the same as a story. Every sitting’s stars go into My Stars, because every puzzle is new.</li>
          <li>He moves up a level when 6 of his last 8 puzzles at his level were right first time, on his own, with at least one of every kind of puzzle on that level (4 of the last 5 on levels 1 to 3). Mistakes never take stars away.</li>
          <li>Puzzles done with a hint, or as helper practice, still win stars. Only puzzles he does on his own count towards moving up.</li>
          <li>The first time a kind of puzzle comes up, the game does one first (“Watch me”), then it is his turn.</li>
          <li>After a miss, the game shows the answer and why, then gives him another one like it. If that is hard too, he gets 🛟 helper practice: fewer answers and the first bit marked.</li>
          <li>Every fifth puzzle is a 🔁 old favourite from an earlier level. Kinds he finds harder come up more often.</li>
          <li>When he is doing well, he sometimes gets a 🚀 challenge from the next level. Getting it right counts double towards moving up.</li>
          <li>His level never goes down by itself. You can change it at the top of this panel.</li>
          <li>His level is saved with his stars, so the backup in My Stars keeps it too.</li>
        </ul>
      </section>
      <section class="g-sec">
        <details class="g-details"><summary>All ${TOP} levels</summary>${levels}</details>
      </section>
      <section class="g-sec">
        <button type="button" class="text-btn${resetArmed ? ' confirm' : ''}" data-g="reset">${resetArmed ? 'Tap again to start again from level 1' : 'Start again from level 1'}</button>
        <p class="g-small">His stars in My Stars are kept.</p>
      </section>`;
  }

  function setLevel(n) {
    P.level = clamp(n, 1, TOP);
    P.win = []; P.got = {}; P.at = 0; P.again = null;
    saveProgress();
    levelChanged = true;
  }

  $('#grown-btn').addEventListener('click', () => {
    levelChanged = false;
    resetArmed = false;
    renderGrownups();
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  });
  $('#grown-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => {
    if (!levelChanged) return;
    levelChanged = false;
    pendingCard = null;
    if (!$('#summary').hidden) { renderSummary(); renderTop(); }
    else if (V.free) renderTop();
    else if (session.count >= SITTING) showSummary(true);
    else nextPuzzle();
  });
  dlg.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'g-jump') { setLevel(+el.value); renderGrownups(); return; }
    const key = el.dataset.set;
    if (!key) return;
    if (key === 'watch') { SET.watch = el.checked; saveSet(); }
    if (key === 'calm') { SET.calm = el.checked; saveSet(); applyCalm(); }
    if (key === 'helpers') { helpers = el.checked; Kit.setting('mathsHelpers', helpers); }
    if (key === 'read') Kit.setting('readAloud', el.checked);
  });
  dlg.addEventListener('click', e => {
    const pill = e.target.closest('[data-theme]');
    if (pill) {
      const t = pill.dataset.theme, on = Object.keys(THEMES).filter(themeOn);
      if (themeOn(t) && on.length <= 2) return;             // two or more sets must stay on
      SET.themes[t] = !themeOn(t);
      saveSet();
      renderGrownups();
      return;
    }
    const b = e.target.closest('[data-g]');
    if (!b || b.disabled) return;
    const act = b.dataset.g;
    if (act === 'down' || act === 'up') setLevel(P.level + (act === 'up' ? 1 : -1));
    else if (act === 'reset') {
      if (!resetArmed) {
        resetArmed = true;
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetArmed = false; if (dlg.open) renderGrownups(); }, 3000);
      } else {
        resetArmed = false;
        P = blankProgress();
        saveProgress();
        levelChanged = true;
      }
    }
    renderGrownups();
  });

  /* ============================================================
     Buttons
     ============================================================ */
  panel.addEventListener('click', e => {
    if (V.card || V.locked || V.watching || V.solved) return;
    const btn = e.target.closest('[data-act]');
    if (btn) {
      if (btn.disabled) return;
      switch (btn.dataset.act) {
        case 'pick': pickChoice(btn); break;
        case 'text': pickText(btn); break;
        case 'opt': pickOption(btn); break;
        case 'pal': tapPalette(btn); break;
        case 'add': addPiece(btn); break;
        case 'undo': undoPiece(); break;
      }
      return;
    }
    const car = e.target.closest('.train.tap .car');
    if (car && V.pz.mech === 'tap') tapCar(car);
  });
  panel.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('car') && e.target.closest('.train.tap')) {
      e.preventDefault();
      e.target.click();
    }
  });

  mainBtn.addEventListener('click', () => {
    if (V.card) { V.card = null; advance(); return; }
    if (V.locked) { watchMe(); return; }
    if (V.watching || V.revealing) return;
    if (!V.solved) { if (V.pz.mech === 'build' && buildReady()) checkBuild(); return; }
    if (V.demo) startPlanned();
    else if (V.free) startFree();
    else advance();
  });
  hintBtn.addEventListener('click', showHint);
  backBtn.addEventListener('click', () => showSummary(true));
  $('#say-btn').addEventListener('click', () => speak(V.card || !V.pz ? msgSay : `${$('#q') ? $('#q').textContent : ''} ${V.pz.card || ''} ${msgSay}`));
  $('#again-btn').addEventListener('click', startSession);
  $('#free-btn').addEventListener('click', startFree);

  /* Settings: sounds (shared with the rest of the hub) and calm mode */
  function applyCalm() { document.body.classList.toggle('calm', !!SET.calm); }
  function showSoundButton() {
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    $('#sound-icon').textContent = soundOn ? '🔔' : '🔕';
    $('#sound-text').textContent = soundOn ? 'Sounds on' : 'Sounds off';
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    Kit.setting('sounds', soundOn);
    showSoundButton();
    playSound('tick');
  });

  // A small hook so the game can be tested automatically; it changes nothing on its own
  window.patternsGame = {
    progress: () => JSON.parse(JSON.stringify(P)), view: () => V, session: () => session,
    LADDER, STAGES, GEN, KIND_NAME, FAMILY, entryFor, makePuzzle, makePlan, kindsOf, uncovered, periodOf, structureCheck,
    // show one puzzle from a level's deck (for testing): e is a kind such as 'next', or a deck entry
    show: (lvl, e, k = 0, o = {}) => { const plan = { flavour: o.flavour || 'level', lvl, e, k, helper: !!o.helper }; showPuzzle(makePuzzle(plan, o.demo), plan, o); },
  };

  applyCalm();
  showSoundButton();
  startSession();
})();
</script>
</body>
</html>

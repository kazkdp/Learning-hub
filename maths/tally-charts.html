<!DOCTYPE html>
<html lang="en-GB" data-root="..">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tallies and Bar Charts – Learning Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css?v=6">
<style>
  /* ============================================================
     Tallies and Bar Charts. Looks like his maths book: squared paper,
     pen tally marks with the fifth mark in red, and bar charts made
     by colouring in squares. Shared look (font, top bar, Home button)
     comes from kit.css.
     ============================================================ */
  :root {
    --paper: #FFFFFF;
    --grid: #E4EDF8;
    --edge: #BCD1E7;
    --rule: #A9C0DB;
    --ink: #1D2B4F;
    --ink-soft: #55657F;
    --ink-faint: #8C9AB2;
    --red-pen: #E23B32;
    --good: #1E9E5A; --good-dark: #157443; --good-tint: #E4F6EB;
    --fix: #E89A00;  --fix-dark: #A86F00;  --fix-tint: #FFF3D6;
    --sun: #FFC83D;  --sun-dark: #D69A00;  --sun-tint: #FFF6D8;
    --focus: #2F6FEB;
  }

  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- Top bar: Home, Maths, level, steps, tools ---------- */
  .topbar { flex: none; gap: 10px 14px; }
  .game-id { margin-right: auto; min-width: 0; }
  .game-id .topbar-title { margin: 0; white-space: nowrap; }
  .level-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .level-badge {
    padding: 2px 10px; border-radius: 999px;
    font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
    background: var(--ink);
  }
  .level-badge.pop { animation: badgepop .9s ease-out; }
  @keyframes badgepop { 35% { transform: scale(1.25); background: var(--good); } }
  .meter { display: inline-flex; align-items: center; gap: 6px; }
  .meter-bar { width: 64px; height: 10px; border-radius: 5px; background: #E6ECF3; overflow: hidden; }
  .meter-fill { display: block; height: 100%; border-radius: 5px; background: var(--sun); transition: width .4s ease; }
  .meter-num { font-size: 14px; font-weight: 700; color: var(--fix-dark); white-space: nowrap; }
  .meter.pop .meter-fill { animation: meterpop .7s ease-out; }
  @keyframes meterpop { 40% { background: var(--sun-dark); } }
  .meter .top { font-size: 14px; font-weight: 700; color: var(--fix-dark); }
  .round-label { font-size: 15px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
  .flavour { padding: 2px 9px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .flavour.challenge { background: #FFE6D2; color: #8F3A00; }
  .flavour.twist { background: #E7E2FA; color: #4A2E98; }

  .stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; }
  .stepper li { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; }
  .stepper li + li::before { content: ""; width: 30px; height: 3px; border-radius: 2px; background: var(--edge); margin-right: 2px; }
  .stepper .dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700;
    background: var(--paper); border: 2px solid var(--edge); color: var(--ink-faint);
  }
  .stepper li.now { color: var(--ink); }
  .stepper li.now .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
  .stepper li.done { color: var(--good-dark); }
  .stepper li.done .dot { background: var(--good); border-color: var(--good-dark); color: #fff; }
  .stepper li.done.star { color: #8A5A00; }
  .stepper li.done.star .dot { background: #FFF6D6; border-color: #E8A400; font-size: 16px; }
  .stepper li.done + li::before { background: var(--good); }

  .tools { flex: none; display: flex; gap: 8px; }
  .tools .btn-tool { min-width: 46px; padding: 8px 12px; }
  .tools .ico { font-size: 20px; line-height: 1; }
  .tools .btn-tool:disabled { opacity: .4; }
  .tools .btn-tool.confirm { background: var(--fix-tint); border-color: var(--fix); color: var(--ink); }
  .tool-text { display: none; }
  .btn-tool.confirm .tool-text { display: inline; }
  @media (min-width: 1500px) { .tool-text { display: inline; } }

  /* ---------- Game area ---------- */
  .app {
    flex: 1; min-height: 0;
    width: 100%; max-width: 1600px;
    margin: 0 auto;
    padding: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stage { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 5fr 7fr; }
  .stage.step-2 { grid-template-columns: 2fr 3fr; }
  .stage.step-3 { grid-template-columns: 2fr 3fr; }
  .panel {
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 18px;
    box-shadow: 0 4px 0 var(--edge);
    overflow: hidden;
  }
  .panel-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 6px; }
  .panel-head h2 { font-size: 21px; color: var(--ink); }
  .panel-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 14px; }
  .paper-grid {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .pill { font-size: 16px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #EEF3FA; white-space: nowrap; }
  .pill.all { background: var(--good-tint); color: var(--good-dark); }
  .key { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .key .tsvg { height: 28px; width: auto; }

  /* ---------- Counting: pictures to find ---------- */
  .board {
    flex: 1; min-height: 0; overflow: auto;
    margin: 0 14px; padding: 10px;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px;
    background: #F3F7FC; border: 2px dashed #C6D6E9; border-radius: 14px;
  }
  .tok {
    --s: var(--tok, 64px);
    position: relative; flex: none;
    width: var(--s); height: var(--s); padding: 0;
    display: grid; place-items: center;
    font-size: calc(var(--s) * .56); line-height: 1;
    background: var(--t); border: 2px solid var(--c); border-radius: calc(var(--s) * .24);
    box-shadow: 0 3px 0 var(--d);
    transition: transform .1s ease, background-color .15s ease;
  }
  .tok:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--d); }
  .tok .emo { transition: opacity .15s ease; }
  .tok.ticked { background: var(--good-tint); border-color: var(--good); box-shadow: 0 3px 0 #9ED6B6; }
  .tok.ticked .emo { opacity: .25; }
  .tok.ticked::after {
    content: "✓";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: calc(var(--s) * .6); font-weight: 700; color: var(--good-dark);
  }
  .tok.glow { animation: glow .9s ease-in-out 3; }
  @keyframes glow { 50% { transform: scale(1.12); box-shadow: 0 0 0 6px var(--sun), 0 3px 0 var(--d); } }
  .panel-foot { flex: none; display: flex; justify-content: flex-start; padding: 6px 14px 10px; }
  .text-btn {
    padding: 6px 4px;
    font-size: 16px; font-weight: 700; color: var(--ink-soft);
    background: none; border: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .text-btn.confirm { color: #B3261E; }

  /* ---------- Tally chart ---------- */
  .tally-table { width: 100%; border-collapse: collapse; }
  .tally-table th {
    padding: 4px 10px 6px;
    text-align: left; font-size: 15px; font-weight: 700; color: var(--ink-soft);
    border-bottom: 3px solid var(--rule);
  }
  .tally-table td { padding: 8px 10px; vertical-align: middle; border-bottom: 2px solid var(--rule); transition: background-color .2s; }
  .tally-table tr:last-child td { border-bottom: 0; }
  .tally-table th + th, .tally-table td + td { border-left: 2px solid var(--rule); }
  .tally-table .col-item, .tally-table .col-mark, .tally-table .col-total { width: 1%; white-space: nowrap; }
  .tally-table tr.ok td { background: rgba(30, 158, 90, .09); }
  .tally-table tr.fix td { background: rgba(232, 154, 0, .14); }
  .tally-table tr.pulse td { animation: rowpulse .9s ease-in-out 3; }
  @keyframes rowpulse { 50% { background: #FFE9A6; } }

  .item { display: flex; align-items: center; gap: 10px; }
  .ico {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font-size: 25px;
    background: var(--t); border: 2.5px solid var(--c);
  }
  .nm { font-size: 18px; font-weight: 700; }
  .mk { display: flex; gap: 8px; }

  .tally { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 16px; min-height: 46px; }
  .grp { display: flex; flex-direction: column; align-items: center; }
  .tsvg { display: block; height: 44px; width: auto; overflow: visible; }
  .tsvg path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
  .tsvg path.gate { stroke: var(--red-pen); stroke-width: 4.5; }
  .tsvg path.draw { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .2s ease-out forwards; }
  .tsvg path.gate.draw { animation-duration: .35s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .five { margin-top: 2px; font-size: 14px; font-weight: 700; line-height: 1; color: var(--ink-soft); }
  body.no-helpers .five { display: none; }
  body.show-fives .five { display: block; color: var(--fix-dark); animation: blinkfive .8s ease-in-out 5; }
  @keyframes blinkfive { 50% { opacity: .3; } }

  .total-wrap { position: relative; display: inline-block; }
  .num {
    width: 72px; height: 54px;
    text-align: center; font-size: 28px; font-weight: 700; color: var(--ink);
    background: var(--paper); border: 2.5px solid var(--ink-faint); border-radius: 12px;
  }
  .num:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px #CFE0FF; }
  .num::placeholder { color: #B5C0D3; }
  .num:disabled { opacity: 1; background: transparent; border-color: transparent; color: var(--ink); }
  .badge {
    position: absolute; top: -9px; right: -9px;
    width: 26px; height: 26px; border-radius: 50%;
    display: none; place-items: center;
    font-size: 16px; font-weight: 700; color: #fff;
    border: 2px solid #fff;
  }
  tr.ok .badge { display: grid; background: var(--good); }
  tr.ok .badge::after { content: "✓"; }
  tr.fix .badge { display: grid; background: var(--fix); }
  tr.fix .badge::after { content: "?"; }
  .total-ro { display: inline-block; min-width: 48px; text-align: center; font-size: 28px; font-weight: 700; }

  /* ---------- Buttons ---------- */
  .btn {
    --sh: rgba(0, 0, 0, .2);
    min-height: 48px; padding: 0 16px;
    font-size: 19px; line-height: 1;
    border: 0;
    box-shadow: 0 4px 0 var(--sh);
    transition: transform .07s ease, box-shadow .07s ease;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sh); }
  .btn:disabled { opacity: .4; }
  .btn-ink { background: var(--ink); color: #fff; --sh: #0B1530; min-width: 64px; }
  .btn-soft { background: var(--paper); color: var(--ink); border: 2px solid var(--edge); --sh: var(--edge); min-width: 52px; }
  .btn-sun { background: var(--sun); color: var(--ink); --sh: var(--sun-dark); min-height: 56px; }
  .actions .btn-primary { min-width: 230px; }

  /* ---------- Bar chart ---------- */
  .chart-box { position: relative; flex: 1; min-height: 0; margin: 0 10px 10px; user-select: none; -webkit-user-select: none; }
  .chart-box.live { touch-action: none; cursor: pointer; }
  .chart-box svg.chart { position: absolute; top: 0; left: 0; display: block; }
  .chart text { font-family: var(--font); }
  .chart .sq { fill: none; stroke: #EEF3FA; stroke-width: 1; }
  .chart .pg { fill: none; stroke: #D9E5F2; stroke-width: 1; }
  .chart .p5 { fill: none; stroke: #A8BEDA; stroke-width: 1.5; }
  .chart .guide { fill-opacity: .55; stroke-opacity: .5; stroke-width: 2; stroke-dasharray: 5 4; }
  .chart .cells { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1.5; }
  .chart .axis { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart .yl, .chart .yt, .chart .xn { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .chart .yl { font-size: 15px; font-weight: 700; fill: var(--ink-soft); text-anchor: end; dominant-baseline: central; }
  .chart .y5 { fill: var(--ink); }
  .chart .yt { font-size: 14px; font-weight: 700; fill: var(--ink-soft); text-anchor: middle; }
  .chart .xe { font-size: 27px; text-anchor: middle; dominant-baseline: central; }
  .chart .xn { font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .chart .xn.xs { font-size: 12px; }
  .chart .bub rect { fill: var(--ink); }
  .chart .bub text { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .chart .st circle { stroke: #fff; stroke-width: 2; }
  .chart .st.ok circle { fill: var(--good); }
  .chart .st.fix circle { fill: var(--fix); }
  .chart .st text { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .chart .pulse { fill: none; stroke: var(--sun-dark); stroke-width: 4; stroke-dasharray: 8 6; animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { stroke-opacity: .2; } }
  .chart .diffline { stroke: var(--sun-dark); stroke-width: 2.5; stroke-dasharray: 6 5; }
  .chart .diffband { stroke: var(--sun-dark); stroke-width: 2.5; }
  .arrow-btn {
    position: absolute; transform: translate(-50%, -50%);
    width: 46px; height: 42px; padding: 0;
    display: grid; place-items: center;
    font-size: 17px; color: var(--d);
    background: var(--paper); border: 2px solid var(--c); border-radius: 12px;
    box-shadow: 0 3px 0 var(--c);
  }
  .arrow-btn:active:not(:disabled) { transform: translate(-50%, calc(-50% + 2px)); box-shadow: 0 1px 0 var(--c); }
  .arrow-btn:disabled { opacity: .3; }

  /* ---------- Questions ---------- */
  .q-list { display: flex; flex-direction: column; gap: 10px; }
  .q { padding: 12px 14px 14px; background: var(--paper); border: 2px solid var(--edge); border-radius: 16px; transition: background-color .2s, border-color .2s; }
  .q.ok { background: var(--good-tint); border-color: var(--good); }
  .q.fix { background: var(--fix-tint); border-color: var(--fix); }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .q-num {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 700; color: #fff; background: var(--ink);
  }
  .q.ok .q-num { background: var(--good); }
  .q.fix .q-num { background: var(--fix); }
  .q-text { flex: 1; margin: 0; font-size: 20px; font-weight: 700; }
  .say-mini {
    flex: none; width: 40px; height: 40px; padding: 0;
    display: grid; place-items: center; font-size: 17px;
    background: var(--paper); border: 2px solid var(--edge); border-radius: 50%;
  }
  .sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    font-size: 24px; font-weight: 700; line-height: 1.1;
    background: var(--t); border: 2px solid var(--c); border-radius: 12px;
  }
  .chip .emo { font-size: 22px; }
  .op { padding: 0 2px; font-size: 26px; font-weight: 700; color: var(--ink-soft); }
  .unit-word { font-size: 19px; font-weight: 700; color: var(--ink-soft); margin-left: 4px; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; }
  .choice {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 54px; padding: 4px 16px 4px 10px;
    font-size: 18px; font-weight: 700;
    background: var(--paper); border: 2px solid var(--c); border-radius: 14px;
    box-shadow: 0 3px 0 var(--c);
  }
  .choice .emo { font-size: 26px; }
  .choice[aria-pressed="true"] { background: var(--t); outline: 3px solid var(--ink); outline-offset: 2px; }
  .choice:disabled { opacity: .75; }

  /* ---------- Small calculator (questions step) ---------- */
  .calc {
    display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px;
    padding: 8px;
    background: #F3F6FA; border: 2px solid var(--edge); border-radius: 16px;
  }
  .calc-screen {
    flex: 1 1 150px; min-width: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 4px 10px;
    text-align: right;
    background: var(--paper); border: 2px solid var(--ink-faint); border-radius: 12px;
  }
  .calc-label { font-size: 14px; font-weight: 700; line-height: 1.25; color: var(--ink-soft); text-align: left; }
  .calc-sum { min-height: 19px; font-size: 15px; line-height: 1.25; font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; }
  .calc-big { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--ink); }
  .calc-keys { display: grid; grid-template-columns: repeat(7, 40px); grid-auto-rows: 38px; gap: 6px; }
  .calc-key {
    padding: 0;
    font-size: 20px; font-weight: 700; color: var(--ink);
    background: var(--paper); border: 2px solid var(--edge); border-radius: 10px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .calc-key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .calc-key.op { background: #E8EEF7; }
  .calc-key.eq { color: #fff; background: var(--good); border-color: var(--good-dark); box-shadow: 0 3px 0 var(--good-dark); }
  .calc-key.clear { color: var(--fix-dark); background: var(--fix-tint); border-color: var(--fix); box-shadow: 0 3px 0 var(--fix); }

  /* ---------- Message and main buttons ---------- */
  .actionbar {
    flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 8px;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 16px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .msg {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    min-height: 56px; padding: 6px 12px 6px 6px;
    border-radius: 12px;
    transition: background-color .2s;
  }
  .msg[data-kind="ok"] { background: var(--good-tint); }
  .msg[data-kind="fix"] { background: var(--fix-tint); }
  .msg[data-kind="hint"] { background: var(--sun-tint); }
  .msg p { margin: 0; font-size: 19px; font-weight: 600; }
  .say-btn {
    flex: none; width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; font-size: 19px;
    background: var(--paper); border: 2px solid var(--edge); border-radius: 50%;
  }
  .actions { flex: none; display: flex; gap: 10px; }

  /* ---------- End of a session ---------- */
  .summary { flex: 1; min-height: 0; display: grid; place-items: center; overflow: auto; }
  .summary-card {
    width: min(580px, 100%);
    padding: 26px;
    text-align: center;
    background: var(--paper);
    border: 2px solid var(--edge); border-radius: 22px;
    box-shadow: 0 5px 0 var(--edge);
  }
  .trophy { font-size: 60px; line-height: 1; }
  .summary h2 { margin: 6px 0 8px; font-size: 30px; color: var(--ink); }
  .summary-stars { margin: 0 0 12px; font-size: 20px; color: var(--ink-soft); }
  .summary-stars b { font-size: 40px; color: #B26B00; margin-right: 6px; }
  .round-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .round-list li {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 10px; border-radius: 12px;
    font-size: 13px; color: var(--ink-soft);
    background: #F4F7FB; border: 2px solid #E3EAF2;
  }
  .round-list .rs { font-size: 16px; letter-spacing: 1px; }
  .round-list .off { opacity: .25; filter: grayscale(1); }
  .summary-level { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .summary-level .level-badge { font-size: 19px; padding: 4px 14px; }
  .summary p.note-line { margin: 0 0 18px; font-size: 18px; color: var(--ink-soft); }
  .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- Grown-ups panel ---------- */
  dialog.grown {
    width: min(660px, calc(100vw - 24px));
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
    padding: 0;
    color: var(--ink);
    background: var(--paper);
